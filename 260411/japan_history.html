<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>日本史 大探求</title>
<style>
:root{
  --bg:#06080d;--card:rgba(255,255,255,.055);--border:rgba(201,162,39,.26);
  --gold:#c9a227;--gold2:#ffd700;--crimson:#8b1a1a;
  --cream:#f0e8d8;--muted:rgba(240,232,216,.48);
  --shadow:0 8px 32px rgba(0,0,0,.7);--r:16px;
  --era-c:var(--gold);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:-apple-system,'Hiragino Mincho ProN','Yu Mincho',serif;background:var(--bg);color:var(--cream);user-select:none}
button{cursor:pointer;font-family:inherit;border:none;outline:none;color:inherit}
button:active{filter:brightness(.8)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 15% 40%,rgba(201,162,39,.04) 0%,transparent 55%),
             radial-gradient(ellipse at 85% 65%,rgba(139,26,26,.05) 0%,transparent 50%)}
.screen{display:none;position:fixed;inset:0;flex-direction:column;overflow:hidden;z-index:1}
.screen.active{display:flex}
.s-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.s-body::-webkit-scrollbar{display:none}

/* ═══ ホーム ═══ */
#screen-home{background:linear-gradient(175deg,#06080d 0%,#0b1020 100%)}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 15px 8px;flex-shrink:0;
  border-bottom:1px solid var(--border);
  background:rgba(6,8,13,.93);backdrop-filter:blur(12px);
}
.player-wrap{display:flex;align-items:center;gap:10px}
.avatar{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#c9a227,#8b1a1a);
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;
  border:2px solid var(--gold);box-shadow:0 0 16px rgba(201,162,39,.4);
}
.player-lvl{font-size:.7rem;color:var(--gold);font-weight:800;letter-spacing:.05em;margin-bottom:3px}
.xp-row{display:flex;align-items:center;gap:6px}
.xp-bg{width:90px;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;transition:width .6s ease}
.xp-label{font-size:.62rem;color:var(--muted)}
.streak{
  display:flex;align-items:center;gap:4px;
  background:rgba(255,140,0,.11);border:1px solid rgba(255,140,0,.28);
  padding:6px 10px;border-radius:20px;font-size:.78rem;color:#ff9944;font-weight:800;
}
.home-hero{padding:22px 16px 14px;text-align:center;flex-shrink:0;position:relative}
.home-hero::after{
  content:'';position:absolute;bottom:0;left:16%;right:16%;
  height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.home-ttl{
  font-size:clamp(1.9rem,8vw,3rem);font-weight:900;letter-spacing:.12em;
  color:var(--gold);text-shadow:0 0 24px rgba(201,162,39,.45),0 2px 8px rgba(0,0,0,.7);
}
.home-sub{font-size:.8rem;color:var(--muted);margin-top:5px;letter-spacing:.1em}
.home-collect{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:10px 16px 0;background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:30px;padding:7px 16px;font-size:.75rem;color:var(--muted);
}
.collect-n{font-size:1rem;font-weight:900;color:var(--gold)}
.era-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 14px 24px}
.era-card{
  border-radius:var(--r);padding:18px 14px 14px;
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.1);
  transition:transform .2s,box-shadow .2s;text-align:left;
}
.era-card:active{transform:scale(.95)!important}
.era-card::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.1) 0%,transparent 55%)}
.era-card::after{content:attr(data-bg);position:absolute;right:-6px;bottom:-10px;font-size:4rem;opacity:.15;line-height:1}
.ec-icon{font-size:1.9rem;line-height:1;position:relative;z-index:1}
.ec-years{font-size:.62rem;color:rgba(255,255,255,.42);letter-spacing:.04em;position:relative;z-index:1}
.ec-title{font-size:1.05rem;font-weight:900;color:#fff;letter-spacing:.04em;position:relative;z-index:1}
.ec-sub{font-size:.68rem;opacity:.62;position:relative;z-index:1}
.ec-stars{font-size:.7rem;letter-spacing:2px;margin-top:4px;position:relative;z-index:1;min-height:14px}
.ec-diff{position:absolute;top:8px;right:9px;z-index:2;font-size:.6rem;color:rgba(255,255,255,.5);font-weight:700}

/* ═══ 難易度モーダル ═══ */
.diff-modal{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
}
.diff-modal.open{display:flex}
.diff-sheet{
  width:100%;max-width:480px;background:#0e1220;
  border-radius:24px 24px 0 0;border-top:1px solid var(--border);
  padding:20px 16px 32px;
}
.diff-title{text-align:center;font-size:1rem;font-weight:900;color:var(--gold);letter-spacing:.06em;margin-bottom:4px}
.diff-subtitle{text-align:center;font-size:.76rem;color:var(--muted);margin-bottom:16px}
.diff-options{display:flex;flex-direction:column;gap:10px}
.diff-btn{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-radius:14px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);transition:all .15s;text-align:left;
}
.diff-btn:active{transform:scale(.97)}
.diff-stars{font-size:1.1rem;min-width:56px}
.diff-info{flex:1}
.diff-lbl{font-size:.95rem;font-weight:800;color:var(--cream)}
.diff-desc{font-size:.72rem;color:var(--muted);margin-top:2px}
.diff-xp{font-size:.8rem;font-weight:800;color:var(--gold);min-width:60px;text-align:right}
.diff-cancel{width:100%;margin-top:10px;padding:12px;border-radius:12px;background:transparent;
  color:var(--muted);font-size:.85rem;font-weight:700}

/* ═══ 時代詳細 ═══ */
#screen-era{background:var(--bg)}
.era-hdr{
  flex-shrink:0;padding:11px 15px 10px;
  border-bottom:1px solid var(--border);
  background:rgba(6,8,13,.95);backdrop-filter:blur(10px);
}
.era-hdr-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.back-btn{
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  border:1px solid var(--border);flex-shrink:0;transition:background .15s;
}
.back-btn:active{background:rgba(255,255,255,.14)}
.era-hdr-title{font-size:1.4rem;font-weight:900;color:var(--era-c);letter-spacing:.06em}
.era-hdr-period{font-size:.73rem;color:var(--muted);margin-top:2px}
.era-atm{
  font-size:.79rem;line-height:1.75;color:rgba(240,232,216,.75);
  padding:8px 12px;background:rgba(255,255,255,.04);
  border-radius:10px;border-left:3px solid var(--era-c);
}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(6,8,13,.96)}
.tab-btn{
  flex:1;padding:11px 4px;font-size:.8rem;font-weight:700;
  color:var(--muted);letter-spacing:.04em;background:transparent;
  border-bottom:2px solid transparent;transition:all .2s;
}
.tab-btn.on{color:var(--era-c);border-bottom-color:var(--era-c)}
.tab-pane{display:none;padding:14px}
.tab-pane.on{display:block}

/* 年表 */
.tl-item{display:flex;gap:10px;margin-bottom:14px;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:47px;top:20px;bottom:-14px;width:1px;background:linear-gradient(180deg,var(--border),transparent)}
.tl-year{min-width:44px;font-size:.7rem;font-weight:800;color:var(--era-c);text-align:right;padding-top:2px}
.tl-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;border:2px solid var(--era-c);background:var(--bg);margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:.5rem}
.tl-box{flex:1}
.tl-t{font-size:.88rem;font-weight:800;color:var(--cream);margin-bottom:2px}
.tl-d{font-size:.74rem;color:var(--muted);line-height:1.55}

/* 人物カード */
.fig-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fig-card{border-radius:14px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:transform .18s;background:var(--card)}
.fig-card:active{transform:scale(.94)}
.fig-port{height:145px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.fig-port::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.08) 3px,rgba(0,0,0,.08) 4px);z-index:2}
.fig-port-inner{position:relative;z-index:1;text-align:center}
.fig-main-e{font-size:3.2rem;line-height:1;filter:drop-shadow(0 3px 10px rgba(0,0,0,.6))}
.fig-sub-e{font-size:1rem;letter-spacing:4px;margin-top:3px;opacity:.9}
.fig-mon{position:absolute;bottom:7px;right:8px;z-index:3;width:27px;height:27px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid var(--era-c);display:flex;align-items:center;justify-content:center;font-size:.78rem;color:var(--era-c);font-weight:900}
.fig-rar{position:absolute;top:6px;left:7px;z-index:3;font-size:.55rem;color:var(--gold2);letter-spacing:1px}
.fig-info{padding:8px 10px 10px}
.fig-name{font-size:.9rem;font-weight:900;color:var(--cream)}
.fig-ttl{font-size:.67rem;color:var(--era-c);margin-top:2px;line-height:1.3}

/* クイズタブ */
.quiz-tab-wrap{padding:4px 0}
.best-box{background:rgba(201,162,39,.07);border:1px solid rgba(201,162,39,.18);border-radius:12px;padding:14px;margin-bottom:14px;text-align:center}
.best-label{font-size:.75rem;color:var(--muted);margin-bottom:6px}
.best-scores{display:flex;justify-content:center;gap:16px;margin-bottom:4px}
.best-col{text-align:center}
.best-diff-lbl{font-size:.65rem;color:var(--muted)}
.best-val{font-size:1.2rem;font-weight:900;color:var(--gold)}
.quiz-start-btn{
  display:block;width:100%;padding:18px;border-radius:14px;
  font-size:1.05rem;font-weight:900;letter-spacing:.05em;color:#fff;
  box-shadow:var(--shadow);transition:transform .15s;text-align:center;
}
.quiz-start-btn:active{transform:scale(.97)}
.quiz-tab-note{margin-top:12px;font-size:.74rem;color:var(--muted);text-align:center;line-height:1.75}

/* ═══ 人物詳細 ═══ */
#screen-fig{background:var(--bg)}
.fig-dp{height:200px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0}
.fig-dp::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.07) 3px,rgba(0,0,0,.07) 4px);z-index:2}
.fig-dp::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--bg) 100%);z-index:3}
.fig-dp-inner{position:relative;z-index:1;text-align:center}
.fig-dp-main{font-size:5.5rem;line-height:1;filter:drop-shadow(0 4px 14px rgba(0,0,0,.65))}
.fig-dp-sub{font-size:1.6rem;letter-spacing:8px;margin-top:4px;opacity:.9}
.fig-body{padding:0 15px 28px;margin-top:-24px;position:relative;z-index:4}
.fig-nm{font-size:1.75rem;font-weight:900;color:var(--era-c);letter-spacing:.07em}
.fig-rdg{font-size:.73rem;color:var(--muted);margin-top:2px;letter-spacing:.06em}
.fig-badge-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.fig-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.25);
  padding:3px 10px;border-radius:20px;font-size:.72rem;color:var(--era-c);
}
.fig-yrs{font-size:.75rem;color:var(--muted);margin-bottom:11px}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:10px 0}
.section-ttl{font-size:.72rem;color:var(--era-c);font-weight:800;margin-bottom:7px;letter-spacing:.06em}
.fig-bio{font-size:.83rem;line-height:1.8;color:rgba(240,232,216,.82);padding:10px 12px;background:rgba(255,255,255,.04);border-radius:10px;border-left:3px solid var(--era-c);margin-bottom:12px}
.fig-episode{font-size:.8rem;line-height:1.8;color:rgba(240,232,216,.78);padding:10px 12px;background:rgba(201,162,39,.06);border-radius:10px;border:1px solid rgba(201,162,39,.14);margin-bottom:12px;font-style:italic}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.stat-lbl{width:36px;font-size:.68rem;color:var(--muted)}
.stat-bg{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.stat-bar{height:100%;border-radius:3px;transition:width 1s ease}
.stat-v{width:26px;font-size:.68rem;color:var(--cream);text-align:right;font-weight:700}
.ach-item{display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.77rem;line-height:1.55;color:rgba(240,232,216,.76)}
.ach-item::before{content:'▸';color:var(--era-c);flex-shrink:0;margin-top:1px}
.fig-legacy{font-size:.8rem;line-height:1.75;color:rgba(240,232,216,.72);padding:10px 12px;background:rgba(100,100,200,.06);border-radius:10px;border:1px solid rgba(100,100,200,.14);margin-bottom:12px}
.fig-conn{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.conn-tag{padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:.72rem;color:var(--muted)}
.fig-quote{background:rgba(201,162,39,.06);border:1px solid rgba(201,162,39,.14);border-radius:12px;padding:14px 16px;font-size:.82rem;line-height:1.75;color:rgba(240,232,216,.7);font-style:italic;text-align:center;position:relative}
.fig-quote::before{content:'❝';position:absolute;top:-2px;left:8px;font-size:1.5rem;color:var(--gold);opacity:.38;line-height:1}
.fig-quote-ctx{font-size:.68rem;color:var(--muted);margin-top:6px;font-style:normal}
.locked-block{
  padding:14px;border-radius:10px;border:1px dashed rgba(201,162,39,.25);
  background:rgba(201,162,39,.04);text-align:center;margin-bottom:12px;
}
.locked-icon{font-size:1.5rem;margin-bottom:4px}
.locked-txt{font-size:.78rem;color:var(--muted)}
.locked-lv{font-size:.82rem;color:var(--gold);font-weight:800;margin-top:2px}
.lv-bar-wrap{height:4px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:8px}
.lv-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px}

/* ═══ クイズ ═══ */
#screen-quiz{background:var(--bg)}
.quiz-topbar{display:flex;align-items:center;gap:10px;padding:10px 13px;flex-shrink:0;border-bottom:1px solid var(--border)}
.quiz-topbar .back-btn{width:40px;height:40px;font-size:.95rem}
.qz-info{flex:1}
.qz-era-lbl{font-size:.82rem;color:var(--era-c);font-weight:700}
.qz-diff-lbl{font-size:.68rem;color:var(--muted);margin-top:1px}
.qz-xp-badge{font-size:.72rem;background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.2);padding:4px 9px;border-radius:12px;color:var(--gold);font-weight:800;white-space:nowrap}
.prog-bar-bg{width:100%;height:4px;background:rgba(255,255,255,.07);flex-shrink:0}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--era-c),var(--gold2));transition:width .4s ease}
.quiz-body{flex:1;display:flex;flex-direction:column;padding:16px 15px 12px;gap:12px;min-height:0;overflow:hidden}
.q-num-row{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.q-num{font-size:.77rem;color:var(--muted);letter-spacing:.05em}
.q-combo{font-size:.75rem;font-weight:800;color:#ff9944;display:none}
.q-combo.show{display:block}
.q-text{font-size:clamp(.92rem,4vw,1.22rem);font-weight:800;color:var(--cream);line-height:1.52;background:rgba(255,255,255,.04);border-radius:12px;padding:13px;border-left:3px solid var(--era-c);flex-shrink:0}
.q-hint{font-size:.75rem;color:var(--muted);text-align:center;flex-shrink:0}
.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex-shrink:0}
.choice-btn{padding:14px 10px;border-radius:12px;font-size:.87rem;font-weight:800;line-height:1.4;text-align:center;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--cream);transition:all .15s}
.choice-btn:active:not(:disabled){transform:scale(.95)}
.choice-btn.correct{background:rgba(107,203,119,.2)!important;border-color:#6bcb77!important;color:#6bcb77!important}
.choice-btn.wrong{background:rgba(255,107,107,.18)!important;border-color:#ff6b6b!important;color:#ff6b6b!important}
.choice-btn:disabled{cursor:default}

/* 解説パネル */
.exp-panel{
  position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
  background:#0e1220;border-top:1px solid var(--border);
  border-radius:20px 20px 0 0;padding:16px 16px 24px;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.34,1.2,.64,1);
  z-index:50;max-height:55%;overflow-y:auto;
}
.exp-panel.show{transform:translateY(0)}
.exp-result-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.exp-mark{font-size:1.5rem;font-weight:900}
.exp-correct-ans{font-size:.8rem;font-weight:800;color:var(--cream)}
.exp-text{font-size:.8rem;line-height:1.78;color:rgba(240,232,216,.78);margin-bottom:12px}
.exp-next-btn{
  width:100%;padding:14px;border-radius:12px;font-size:.9rem;font-weight:800;
  color:#fff;background:linear-gradient(135deg,var(--gold),#a07010);
  box-shadow:var(--shadow);
}

/* ═══ 結果 ═══ */
#screen-result{background:var(--bg);align-items:center;justify-content:center}
.result-wrap{padding:28px 20px;text-align:center;width:100%;max-width:420px}
.res-era{font-size:.78rem;color:var(--muted);margin-bottom:6px;letter-spacing:.05em}
.res-title{font-size:1.9rem;font-weight:900;color:var(--era-c)}
.res-score{font-size:clamp(3.5rem,13vw,5rem);font-weight:900;color:var(--cream);margin:10px 0 4px}
.res-score span{font-size:1.4rem;color:var(--muted)}
.res-stars{font-size:2.2rem;letter-spacing:8px;margin:6px 0}
.res-xp{display:inline-flex;align-items:center;gap:5px;background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.25);padding:7px 18px;border-radius:20px;margin:8px 0;font-size:.9rem;color:var(--gold);font-weight:800}
.res-msg{font-size:.84rem;color:var(--muted);line-height:1.65;margin:8px 0 20px}
.res-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.res-btn{padding:13px 22px;border-radius:30px;font-size:.92rem;font-weight:800;color:#fff;box-shadow:var(--shadow);transition:transform .15s}
.res-btn:active{transform:scale(.95)}
.achievement-popup{
  position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:rgba(201,162,39,.95);color:#120d00;
  padding:10px 20px;border-radius:30px;font-size:.83rem;font-weight:800;
  transition:transform .3s ease;z-index:300;white-space:nowrap;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:6px;
}
.achievement-popup.show{transform:translateX(-50%) translateY(0)}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.cp{position:absolute;border-radius:2px;animation:cFall linear forwards}
@keyframes cFall{from{transform:translateY(-20px) rotate(0deg);opacity:1}to{transform:translateY(110vh) rotate(540deg);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fadeUp{animation:fadeUp .32s ease both}
@keyframes qIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.qIn{animation:qIn .28s cubic-bezier(.34,1.4,.64,1) both}

/* レスポンシブ */

<!-- ホーム -->
<div id="screen-home" class="screen active">

      <div>

    <div class="era-grid" id="era-grid"></div>
  </div>
</div>

<!-- 時代詳細 -->
<div id="screen-era" class="screen">

    <div class="era-hdr-row">
      <button class="back-btn" onclick="goHome()">◀</button>
      <div>

        <div class="era-hdr-period" id="era-period"></div>
      </div>

  </div>

    <button class="tab-btn on" onclick="switchTab('nen')">📜 年表</button>
    <button class="tab-btn" onclick="switchTab('jin')">⚔️ 人物</button>
    <button class="tab-btn" onclick="switchTab('qz')">🎯 クイズ</button>

  <div class="s-body">
    <div class="tab-pane on" id="tab-nen"></div>
    <div class="tab-pane" id="tab-jin"></div>
    <div class="tab-pane" id="tab-qz"></div>

</div>

<!-- 人物詳細 -->
<div id="screen-fig" class="screen">

    <div class="q-hint" id="q-hint"></div>
    <div class="choices-grid" id="choices-grid"></div>

    {y:1869,t:'五稜郭の戦い・戊辰戦争終結',d:'土方歳三が函館・五稜郭で戦死。幕府軍最後の抵抗が終わり明治新政府が成立した。',i:'❄️'},

  quiz:{

      {q:'黒船来航のアメリカ提督は？',c:['マシュー・ペリー','ハリス','グラント','マッカーサー'],a:0,h:'1853年に浦賀へ',exp:'マシュー・ペリー提督が4隻の黒塗り蒸気船（サスケハナ号など）を率いて浦賀に来航。「開国しなければ攻撃する」と脅し、翌年の日米和親条約締結につながった。この来航が日本の近代化の引き金となった。'},

    normal:[
      {q:'池田屋事件が幕末の流れに与えた最大の影響は？',c:['長州藩が報復として翌年に禁門の変を起こし尊攘運動が激化した','長州藩が完全に幕府側になった','新選組の勢力が拡大し京都を完全制圧した','坂本龍馬が薩長同盟を断念した'],a:0,h:'池田屋事件の翌年',exp:'池田屋事件で多くの同志を失った長州藩は激怒し、1864年に「禁門の変」として京都に兵を進めた。しかし幕府軍に敗れ、朝廷から「朝敵」の汚名を着せられた。この激化が薩長間の結束と倒幕運動の加速につながった。'},
      {q:'坂本龍馬が「大政奉還」という解決策を選んだ理由は？',c:['日本が内戦で弱体化することを欧米列強に付け入られるのを防ぐため','幕府が好きで守りたかったから','薩摩・長州の軍事力が足りなかったから','天皇が強く望んだから'],a:0,h:'列強による植民地化を恐れた',exp:'龍馬は欧米列強がアジアを植民地化していく時代に、日本人同士が内戦で消耗することを最も恐れた。幕府・雄藩・天皇が協調する新政府という構想で、流血なき革命を目指した。その先見性は現代でも高く評価される。'},
      {q:'新選組の「局中法度」の特徴として正しいのは？',c:['違反した場合は切腹という厳格な規律を定めた','隊士の待遇改善を目的として作られた','朝廷から公認された幕府の法律だった','隊士の合議で決められた民主的な規約だった'],a:0,h:'土方が制定した',exp:'局中法度は①士道に背かず②局を脱するを許さず③勝手に金策いたすを許さず④勝手に訴訟取り扱いを許さず⑤私の闘争を許さず、という5カ条からなり、違反すれば切腹を命じた。この峻烈な規律が新選組の強さと苦悩の両面を生み出した。'},
      {q:'幕末の志士が「尊王攘夷」を唱えた背景にある時代の危機感は？',c:['欧米列強による植民地化を恐れ天皇の権威のもと外国人を追い払おうとした','天皇家の財政を守るためだった','幕府の貿易政策への経済的な反発だった','宗教的な外国人排除運動だった'],a:0,h:'幕末の政治スローガン',exp:'インドや中国が欧米に侵略・植民地化されていく様子を見ていた日本の志士たちは「日本も同じ運命をたどる」と危機感を抱いた。「天皇を中心に国内を統一し（尊王）外国人を追い払え（攘夷）」という運動が生まれたが、現実の軍事力差を目にして多くが「開国→富国強兵」路線に転換した。'},
      {q:'五稜郭（函館）が幕府軍最後の拠点となった理由は？',c:['西洋式城郭で防御力が高く榎本武揚らが蝦夷共和国を宣言したため','徳川慶喜が籠城したから','気候が過酷で官軍が近づけなかったから','近海に幕府の海軍が展開していたから'],a:0,h:'北海道の星型要塞',exp:'榎本武揚率いる旧幕府海軍が函館に逃れ、五稜郭（星型の西洋式城塞）を拠点に「蝦夷共和国」を宣言した。土方歳三もここで戦い続けたが、最終的に1869年5月に官軍に敗れ戊辰戦争が終結した。'},
      {q:'「龍馬の暗殺」の犯人はどの説が現在最も有力？',c:['京都見廻組（幕府の別動隊）による実行説','新選組説','薩摩藩黒幕説','土佐藩の内部犯行説'],a:0,h:'近江屋事件（1867年）',exp:'龍馬暗殺は長年「新選組説」が有力視されたが、現在は「京都見廻組の佐々木只三郎らによる実行」説が最も支持されている。ただし背後関係は不明で薩摩・紀州・幕府の黒幕説も残り、歴史の謎の一つとなっている。'},

    hard:[
      {q:'薩長同盟が成立した政治的背景で最も重要な要因は？',c:['長州が禁門の変・四国艦隊砲撃で幕府・外国から二重に打撃を受け薩摩の支援が必要だったから','龍馬の個人的な人脈だけで成立した','両藩とも徳川家への恩義があり融和を図ったから','朝廷の仲介による正式な同盟だったから'],a:0,h:'長州の窮地',exp:'禁門の変で「朝敵」とされ、さらに英仏蘭米4カ国から下関砲撃を受けた長州藩は孤立無援の状態だった。一方で薩摩も単独での討幕は困難。「共通の敵（幕府）を持つ両藩が利害一致した」という政治的リアリズムが同盟成立の本質で、龍馬はその橋渡し役を担った。'},

      {q:'新選組の組織的強さの源泉として最も本質的なのは？',c:['下級武士・農民出身の実力者を身分不問で登用した能力主義','幕府の財政的バックアップ','京都市民の全面的な支持','剣術の高さだけで選抜した純粋な実力集団だった'],a:0,h:'身分にとらわれない人材登用',exp:'江戸時代の身分制度では農民が武士として仕えることは基本的に不可能だった。しかし近藤・土方・沖田はいずれも農民や商人出身。新選組は「剣の腕と武士道精神があれば出身を問わない」という当時としては革命的な能力主義組織だった。この柔軟性が強さの秘密だった。'},
      {q:'坂本龍馬の「船中八策」が後の明治政府に与えた最大の影響は？',c:['議会制度・条約改正・上下院設置など近代的な政治制度の原型を提示した','海軍力の増強計画として活用された','薩長への権力集中を正当化した','外国との通商条約の叩き台となった'],a:0,h:'五箇条の誓文との関連',exp:'1867年11月、龍馬が船中で起草した「船中八策」は①大政奉還②上下議政局設置③官武一途④旧弊の廃絶⑤外国との交際⑥海軍拡張⑦禁衛隊設置⑧金銀為替を規定した。特に議会制度の構想は明治政府の「五箇条の誓文」の「万機公論に決すべし」に継承された。'},
      {q:'幕末期の「雄藩」が倒幕の中心になれた経済的背景は？',c:['薩摩・長州が密貿易・独自産業で財政力を蓄えていたから','幕府の財政が完全に破綻していたから','欧米列強から軍事援助を受けたから','農業改革で農民の支持を得ていたから'],a:0,h:'薩摩・長州の経済力',exp:'薩摩藩は沖縄（琉球王国）を通じた密貿易で財を蓄え、長州藩は下関での砲撃事件後に攘夷から開国に転じ交易で近代化を進めた。一方の幕府は度重なる対外交渉・開港・尊攘運動への対処で財政が逼迫。この経済力格差が武力対決の帰趨を決定付けた。'},
      {q:'土方歳三が最期まで函館で戦い続けた精神的動機として最も深いものは？',c:['武士として徳川への忠義を最後まで貫くという武士道の体現','勝てると信じていたから','逃げ場がなかったから','榎本武揚に義理があったから'],a:0,h:'幕末最後の武士',exp:'明治維新の後、日本では「武士」という身分が廃止された。土方にとって函館での戦いは単なる軍事作戦ではなく「武士として死ぬ場所を求めた」ものだという解釈が有力。勝敗ではなく「武士道の体現」こそが彼の最後の戦いの意味だったと、多くの歴史家が分析している。'},

     ep:'「古池や」の句は江戸の深川に住んでいた芭蕉の庵で詠まれた。弟子たちに「上の句をどうしようか」と問い、芭蕉自身が「古池や」と付けた瞬間に一同が唸ったという。静寂の中に響くカエルの水音が永遠の静けさを際立てるという逆説的な美は、東洋哲学の粋ともいえる。',
     lgc:'芭蕉が確立した「蕉風俳諧」は、後の正岡子規らの「俳句」革新の出発点となった。現代の俳句も芭蕉の「花鳥風月に人間の感情を映す」という方法論を受け継いでいる。',

      {q:'浮世絵が「大衆文化」として普及できた江戸時代の社会的背景は？',c:['木版印刷による量産で庶民でも数十文で購入できた','幕府が無料で配布した','識字率が高く絵の解説文が読めたから','外国人観光客の需要があった'],a:0,h:'価格と技術の関係',exp:'多色木版画により大量生産が可能になり、浮世絵1枚の値段は蕎麦1杯（20文程度）と同程度まで下がった。当時の江戸は世界最大の100万都市で、識字率も高く庶民が文化的な娯楽を享受できる環境が整っていた。'},

      {q:'広重の「雨の表現」が画期的だった理由は？',c:['雨を線で表現することで視覚的リズムと湿度まで感じさせる技法を確立した','写真のように正確に描いたから','西洋の水彩画技法を取り入れたから','実際に雨の中で絵を描いたから'],a:0,h:'「雨の広重」の真骨頂',exp:'広重は雨を斜めの線で表現し、霞・霧・雪などの大気現象を独自の技法で描いた。この「気象の可視化」という革新的アプローチが、後の印象派画家たちに「光と大気を描く」という新しい視点を与えた。モネの睡蓮シリーズにも広重の影響が見られるとされる。'},

      {q:'明治開国後、浮世絵が欧米で「ジャポニスム」として爆発的に評価された社会的背景は？',c:['万国博覧会での出品と陶磁器の梱包材として偶然欧州に大量に流入したことがきっかけだった','明治政府が意図的に外交ツールとして配布した','欧米の日本語学習ブームで日本文化が注目されていた','浮世絵師が欧州に渡り直接売り込んだ'],a:0,h:'19世紀ヨーロッパへの流入ルート',exp:'1850年代以降、開国した日本からの陶磁器の梱包材（緩衝材）として浮世絵が大量に欧州に流入した。印象派の画家たちがこれを発見し「こんな表現があったのか！」と衝撃を受けた。また1867年パリ万博での日本館出品が「ジャポニスム」ブームの決定打となった。'},

      {q:'「敬天愛人」を座右の銘とした維新の英雄は？',c:['西郷隆盛','大久保利通','伊藤博文','木戸孝允'],a:0,h:'西南戦争で自刃',exp:'西郷隆盛（1828〜1877）は薩摩の英雄で明治維新の立役者。しかし征韓論で政府と対立して下野し、1877年の西南戦争で敗れ城山で自刃した。「敬天愛人（天を敬い人を愛す）」という言葉と豪放な人柄は今も多くの人を魅了する。'},

      {q:'大日本帝国憲法が発布されたのは？',c:['1889年','1868年','1904年','1877年'],a:0,h:'伊藤博文が中心となって起草',exp:'1889年（明治22年）2月11日に大日本帝国憲法が発布された。アジア初の近代的成文憲法として伊藤博文らがドイツ・オーストリアの憲法を参考に起草した。天皇主権を定めたこの憲法は1946年の日本国憲法施行まで日本の国制の基盤となった。'},

      {q:'明治維新後に行われた「地租改正」の目的と結果は？',c:['年貢（米による納税）を廃止して地価の3%を現金で納税させ政府の安定財源を確保した','農民への土地分配を行った','地主の力を弱めることに成功した','農業の近代化を実現した'],a:0,h:'税制の近代化',exp:'江戸時代の年貢は米での納税で、豊作・不作により収入が不安定だった。地租改正により地価（土地の値段）に基づく一定率の現金納税に変更。政府は安定した財源を確保できたが、農民の負担は重く地租改正反対一揆が各地で起きた。'},
      {q:'伊藤博文がドイツ（プロイセン）の憲法を参考にした理由は？',c:['天皇の強い権限を残しつつ近代的体裁を整えられる君主主権型憲法だったから','ドイツが日本と軍事同盟を結んでいたから','英国・米国の憲法は複雑すぎたから','ビスマルクが日本に貢献してくれたから'],a:0,h:'天皇主権との両立',exp:'イギリスの議会制民主主義は「民権が強すぎる」、アメリカの共和制は天皇制と相容れない。一方ドイツ（プロイセン）の憲法は「議会を持ちながら君主（皇帝）に強い権限を残す」という体制で、天皇主権を維持しながら近代国家の体裁を整えたい明治政府の要求にぴったりだった。'},
      {q:'日清・日露戦争の勝利が日本に与えた最大の影響は？',c:['欧米列強から「対等な近代国家」として認められ不平等条約の改正につながった','大陸に安定した植民地を獲得できた','ロシアから多額の賠償金を得た','国内の反政府運動が収まった'],a:0,h:'列強との外交的地位の変化',exp:'日清戦争勝利（1895年）で台湾・2億両の賠償金を獲得。日露戦争勝利（1905年）でロシアという欧州の大国を破ったことで「有色人種がアジアで白人国家に勝った」と世界を驚かせた。この結果、アジア各国の独立運動にも影響を与え、不平等条約改正交渉でも日本の立場が強まった。'},
      {q:'福沢諭吉の「脱亜論」（1885年）の主旨は？',c:['朝鮮・清国の近代化が遅れているため日本は欧米と同様に接すべきという主張','アジアとの連帯を強化すべきという主張','欧米文化を拒否してアジア独自の道を歩むべきという主張','移民政策の推進を求めた論文'],a:0,h:'明治18年の評論',exp:'福沢は「文明化の遅れた朝鮮・清国と仲良くしても日本が悪名をもらうだけ。日本は欧米と並ぶ近代国家として進むべきだ」と主張した。この論文は後の帝国主義的膨張の思想的根拠として引用されることもあり、今も評価が分かれる問題作として知られる。'},
      {q:'「殖産興業」政策の具体的な内容として正しいのは？',c:['官営工場の設立・外国人技術者招聘・留学生派遣で産業の近代化を推進した','農業の機械化を最優先にした','外国企業を日本に誘致した','民間企業の設立を禁止して国が全産業を管理した'],a:0,h:'明治政府の産業政策',exp:'殖産興業は国が主導して近代産業を育てる政策。富岡製糸場（1872年・群馬）など官営模範工場の設立、「お雇い外国人」と呼ばれる欧米技術者の招聘、留学生の欧米派遣が三本柱。1880年代以降は民間への払い下げが進み日本の産業資本主義の基盤が形成された。'},

    hard:[
      {q:'明治維新を「上からの革命」と評価する歴史学的見方の根拠は？',c:['農民・商人などの民衆の意思ではなく薩長の下級武士エリートが主導した政治変革だったから','天皇が直接すべての改革を指示したから','外国の圧力により強制的に行われたから','大名たちが合議して自発的に行った改革だったから'],a:0,h:'誰が明治維新を担ったか',exp:'フランス革命が「民衆による下からの革命」だったのに対し、明治維新は薩摩・長州の下級武士（下士）エリートが中心となって主導した「上からの近代化」だった。農民や商人は基本的に観客だった。このため日本の近代化は迅速だったが、民主主義の根付きが浅いという弱点も生んだと指摘される。'},
      {q:'「板垣退助」が推進した「自由民権運動」の歴史的意義として最も包括的なのは？',c:['国民が憲法制定・議会開設を求めた草の根の近代民主主義運動で大日本帝国憲法の早期制定を促した','政府に武力で対抗しようとした反乱運動だった','外国の支援を受けた反政府活動だった','薩長藩閥打倒のみを目的とした権力闘争だった'],a:0,h:'明治10年代の政治運動',exp:'1874年から始まった自由民権運動は「国民にも政治参加の権利を」という近代民主主義の要求運動。板垣退助が中心となり全国に広まった。政府はこれを弾圧しつつも、1889年の憲法制定・1890年の帝国議会開設を早める要因となった。「民から生まれた近代」への第一歩として高く評価される。'},
      {q:'日露戦争後のポーツマス条約に対して「小村寿太郎外交の功罪」として議論されることは？',c:['賠償金なしの講和条件に国内で暴動（日比谷焼打事件）が起きたが一方で日本の国力の限界を現実的に判断した外交だった','賠償金を大きく得たため批判された','ロシアから領土を多く奪いすぎたために国際的に孤立した','アメリカとの関係を悪化させた'],a:0,h:'1905年の講和条約',exp:'ポーツマス条約で日本は樺太南半分・旅順・大連・南満州鉄道を獲得したが、賠償金を得られなかった。戦費を国債で賄った国民は「なぜ賠償金がないのか」と怒り日比谷焼打事件が勃発。しかし実際には戦争継続の国力がなく、外務大臣小村寿太郎が最善の条件を引き出したという歴史的評価もある。'},
      {q:'福沢諭吉の「独立自尊」という教育理念が現代日本に与えた遺産として最も本質的なのは？',c:['「自分の頭で考え判断する主体的な人間」を育てるという日本の近代教育の理念的基盤となった','欧米式の教育を機械的に導入した','国家への絶対的な服従を教えた','経済的な自立だけを目標とした'],a:0,h:'慶應義塾の教育理念',exp:'「独立自尊」は「経済的自立」だけでなく「精神的・思想的な独立（自分で判断する力）」を意味する。福沢が「国民の啓蒙」を最優先としたのは、近代国家の主役は「お上の言うことを聞く臣民」でなく「自ら考える市民」でなければならないという確信から。この理念は現代教育における「主体的・対話的な深い学び」の遠い祖先にあたる。'},
      {q:'明治期の「不平等条約改正」が最終的に達成されるまでにかかった年数と理由は？',c:['40年以上かかった。欧米が「日本の法制度が未整備」と主張し続けたため近代的な法典整備が先決だったから','10年で達成できた','軍事力で圧力をかけて解決した','外国公使の暗殺事件をきっかけに解決した'],a:0,h:'1858年〜1899年',exp:'1858年の安政の五ヶ国条約から、1899年の領事裁判権撤廃まで実に41年かかった。欧米諸国は「日本に近代的な司法制度がないから自国民を日本の法廷に出せない」として改正を拒否。大日本帝国憲法・民法・刑法などの近代的法典整備が完了してようやく撤廃に漕ぎ着けた。'},
      {q:'西南戦争が近代日本の軍事史に持つ歴史的意義は？',c:['徴兵制による国民軍が武士（士族）の反乱を鎮圧したことで近代的な軍事制度の優位が実証された','幕府の残党が完全に消滅した節目だった','国外への軍事侵攻の出発点となった','天皇陛下が直接指揮を執った初の戦争だった'],a:0,h:'最後の武士反乱',exp:'西南戦争では農民・町人を徴兵した政府軍が、武士（士族）の精鋭で構成された西郷軍を破った。これにより「武士＝最強の戦士」という江戸時代の常識が崩れ、「訓練された国民軍の方が強い」という近代軍事の原則が日本でも実証された。以後、武士階級が軍の主体という考え方は消滅した。'},
    ]
  }
}];

// ═══════════════════════════════════════
//  ステート
// ═══════════════════════════════════════
const SK = 'jhist2';
let sv = JSON.parse(localStorage.getItem(SK)||'{"xp":0,"str":0,"ld":"","bq":{},"seen":{}}');
let CE = null, CF = null;
let QQ=[], QI=0, QScore=0, QXp=0, QDiff='easy', QCombo=0;
let isAnswered=false;
const XPL=200;
const LNAMES=['','史学生','読書家','武士','侍大将','大名','老中','関白','将軍','大老','天下人'];
const XPD={easy:10,normal:20,hard:35};
const DNAMES={easy:'⭐ 初級',normal:'⭐⭐ 中級',hard:'⭐⭐⭐ 上級'};

function save(){ localStorage.setItem(SK,JSON.stringify(sv)); }

function checkStreak(){
  const t=new Date().toDateString();
  if(sv.ld===t) return;
  const y=new Date(Date.now()-86400000).toDateString();
  sv.str=(sv.ld===y)?sv.str+1:1;
  sv.ld=t; save();
}

function lv(){ return Math.floor(sv.xp/XPL)+1; }

// ═══════════════════════════════════════
//  ホーム
// ═══════════════════════════════════════
function renderHome(){
  checkStreak();
  const l=lv();
  const ln=LNAMES[Math.min(l,LNAMES.length-1)];
  document.getElementById('lvl-txt').textContent=`Lv.${l} ${ln}`;
  const xi=sv.xp%XPL;
  document.getElementById('xp-fill').style.width=(xi/XPL*100)+'%';
  document.getElementById('xp-label').textContent=`${xi}/${XPL}XP`;
  document.getElementById('streak-num').textContent=sv.str;

  // 図鑑カウント
  const total=ERAS.reduce((s,e)=>s+e.figures.length,0);
  const seen=Object.keys(sv.seen).length;
  document.getElementById('collect-n').textContent=seen+'/'+total;

  const grid=document.getElementById('era-grid');
  grid.innerHTML=ERAS.map(e=>{
    const b=sv.bq[e.id]||{};
    const bs=Math.max(b.easy||0,b.normal||0,b.hard||0);
    const len=e.quiz.easy.length;
    const stars=bs>=len?'⭐⭐⭐':bs>=Math.ceil(len*.75)?'⭐⭐':bs>=Math.ceil(len*.5)?'⭐':'';
    const diff=b.hard>0?'上級クリア':b.normal>0?'中級クリア':b.easy>0?'初級クリア':'未挑戦';
    return `<button class="era-card fadeUp" style="background:${e.grad};border-color:${e.icon}" data-bg="${e.bg}" onclick="openEra('${e.id}')">
      <div class="ec-icon">${e.icon}</div>
      <div class="ec-years">${e.years}</div>
      <div class="ec-title">${e.title}</div>
      <div class="ec-sub">${e.sub}</div>
      <div class="ec-stars">${stars}</div>
      <div class="ec-diff">${diff}</div>
    </button>`;
  }).join('');
}

function goHome(){
  showScreen('home');
  renderHome();
}

// ═══════════════════════════════════════
//  時代詳細
// ═══════════════════════════════════════

  CE=ERAS.find(e=>e.id===id);
  document.documentElement.style.setProperty('--era-c',CE.ec);
  document.getElementById('era-ttl').textContent=CE.icon+' '+CE.title;
  document.getElementById('era-period').textContent=CE.sub+'　'+CE.years;
  document.getElementById('era-atm').textContent=CE.atm;

  // 年表
  document.getElementById('tab-nen').innerHTML='<div class="fadeUp">'+
    CE.events.map(ev=>`<div class="tl-item">
      <div class="tl-year">${ev.y}</div>
      <div class="tl-dot">${ev.i}</div>
      <div class="tl-box"><div class="tl-t">${ev.t}</div><div class="tl-d">${ev.d}</div></div>
    </div>`).join('')+'</div>';

  // 人物
  document.getElementById('tab-jin').innerHTML='<div class="fig-grid fadeUp">'+
    CE.figures.map(f=>`<div class="fig-card" onclick="openFigure('${f.id}')">
      <div class="fig-port" style="background:${f.pbg}">

        <div class="fig-rar">${f.rar}</div>
        <div class="fig-mon">${f.mon}</div>
      </div>
      <div class="fig-info"><div class="fig-name">${f.name}</div><div class="fig-ttl">${f.ttl}</div></div>
    </div>`).join('')+'</div>';

  // クイズタブ
  const b=sv.bq[CE.id]||{};
  document.getElementById('tab-qz').innerHTML=`<div class="quiz-tab-wrap fadeUp">
    <div class="best-box">
      <div class="best-label">ベストスコア　（各${CE.quiz.easy.length}問）</div>
      <div class="best-scores">
        ${['easy','normal','hard'].map(d=>`<div class="best-col">
          <div class="best-diff-lbl">${DNAMES[d]}</div>
          <div class="best-val">${b[d]!==undefined?b[d]+'問':'−'}</div>
        </div>`).join('')}
      </div>
    </div>
    <button class="quiz-start-btn" style="background:${CE.grad}" onclick="openDiffModal()">
      ⚔️ クイズに挑戦！
    </button>
    <div class="quiz-tab-note">
      初級 <strong style="color:var(--era-c)">+10</strong>　中級 <strong style="color:var(--era-c)">+20</strong>　上級 <strong style="color:var(--era-c)">+35</strong> XP/問<br>
      全問正解ボーナス <strong style="color:var(--era-c)">+50 XP</strong>
    </div>
  </div>`;

  switchTab('nen');
  showScreen('era');
}

function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('on',['nen','jin','qz'][i]===name);
  });
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('on'));
  document.getElementById('tab-'+name).classList.add('on');
}

// ═══════════════════════════════════════
//  人物詳細
// ═══════════════════════════════════════
function openFigure(id){
  CF=CE.figures.find(x=>x.id===id);
  sv.seen[CE.id+'_'+id]=1; save();

  const l=lv();
  const ep_lock=l<3, conn_lock=l<5, lgc_lock=l<7;

  // ポートレート
  document.getElementById('fig-dp').innerHTML=
    `<div style="position:absolute;inset:0;background:${CF.pbg}"></div>
     <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.07) 3px,rgba(0,0,0,.07) 4px)"></div>
     <div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--bg) 100%)"></div>
     <div class="fig-dp-inner"><div class="fig-dp-main">${CF.e1}</div><div class="fig-dp-sub">${CF.e2}</div></div>`;

  const sc={武力:'#ff6b6b',知略:'#4d96ff',魅力:'#c77dff',人望:'#6bcb77'};
  const statsH=Object.entries(CF.stats).map(([k,v])=>`
    <div class="stat-row">
      <div class="stat-lbl">${k}</div>

      <div class="stat-v">${v}</div>

  const xpPct=((l-1)%1*100)||0;

  let html=`

    <div class="fig-badge-row">

      <span class="fig-badge">${CF.mon} ${CF.mon}</span>
      <span class="fig-badge">${CF.ttl}</span>
    </div>
    <div class="fig-yrs">📅 ${CF.yrs}</div>
    <div class="divider"></div>
    <div class="section-ttl">▸ 人物紹介</div>
    <div class="fig-bio">${CF.bio}</div>
    <div class="section-ttl">▸ ステータス</div>
    ${statsH}
    <div class="divider"></div>
    <div class="section-ttl">▸ 主な功績</div>
    ${CF.ach.map(a=>`<div class="ach-item">${a}</div>`).join('')}
    <div class="divider"></div>`;

  // エピソード（Lv.3解放）
  if(ep_lock){
    html+=`<div class="locked-block">
      <div class="locked-icon">📖</div>
      <div class="locked-txt">伝説のエピソード</div>
      <div class="locked-lv">🔒 Lv.3 で解放</div>
      <div class="lv-bar-wrap"><div class="lv-bar-fill" style="width:${Math.min((l/3)*100,100)}%"></div></div>
    </div>`;
  } else {
    html+=`<div class="section-ttl">📖 伝説のエピソード</div>
    <div class="fig-episode">${CF.ep}</div>`;
  }

  // 繋がり（Lv.5解放）
  if(conn_lock){
    html+=`<div class="locked-block">
      <div class="locked-icon">🔗</div>
      <div class="locked-txt">人物の繋がり</div>
      <div class="locked-lv">🔒 Lv.5 で解放</div>
      <div class="lv-bar-wrap"><div class="lv-bar-fill" style="width:${Math.min((l/5)*100,100)}%"></div></div>
    </div>`;
  } else {
    html+=`<div class="section-ttl">🔗 人物の繋がり</div>
    <div class="fig-conn">${CF.conn.map(c=>`<span class="conn-tag">${c}</span>`).join('')}</div>`;
  }

  // 歴史的遺産（Lv.7解放）
  if(lgc_lock){
    html+=`<div class="locked-block">
      <div class="locked-icon">🏛️</div>
      <div class="locked-txt">歴史的遺産・後世への影響</div>
      <div class="locked-lv">🔒 Lv.7 で解放</div>
      <div class="lv-bar-wrap"><div class="lv-bar-fill" style="width:${Math.min((l/7)*100,100)}%"></div></div>
    </div>`;
  } else {
    html+=`<div class="section-ttl">🏛️ 歴史的遺産・後世への影響</div>
    <div class="fig-legacy">${CF.lgc}</div>`;
  }

  html+=`<div class="divider"></div>
    <div class="fig-quote">${CF.quote}<div class="fig-quote-ctx">${CF.qctx}</div></div>`;

  document.getElementById('fig-body').innerHTML=html;
  showScreen('fig');
}

function backToEra(){ showScreen('era'); }

// ═══════════════════════════════════════
//  クイズ
// ═══════════════════════════════════════
function openDiffModal(){
  document.getElementById('diff-modal').classList.add('open');
}
function closeDiffModal(e){
  if(!e||e.target.id==='diff-modal') document.getElementById('diff-modal').classList.remove('open');
}

function startQuiz(diff){
  closeDiffModal();
  QDiff=diff;
  const raw=[...CE.quiz[diff]];
  QQ=shuffleChoices(shuffle(raw));
  QI=0; QScore=0; QXp=0; QCombo=0; isAnswered=false;
  document.getElementById('qz-era-lbl').textContent=CE.icon+' '+CE.title;
  document.getElementById('qz-diff-lbl').textContent=DNAMES[diff]+'　+'+XPD[diff]+'XP/問';
  document.getElementById('exp-panel').classList.remove('show');
  showScreen('quiz');
  showQ();
}

function replayQuiz(){ startQuiz(QDiff); }

function shuffleChoices(qs){
  return qs.map(q=>{
    const arr=q.c.map((c,i)=>({c,i}));
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return{...q,c:arr.map(x=>x.c),a:arr.findIndex(x=>x.i===q.a)};
  });
}

function showQ(){
  document.getElementById('exp-panel').classList.remove('show');
  if(QI>=QQ.length){finishQuiz();return;}
  const q=QQ[QI];
  const tot=QQ.length;
  document.getElementById('q-num').textContent=`第${QI+1}問　／　全${tot}問`;
  document.getElementById('prog-fill').style.width=(QI/tot*100)+'%';
  document.getElementById('qz-xp-badge').textContent=`+${QXp} XP`;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('q-hint').textContent=`💡 ヒント：${q.h}`;
  const combo=document.getElementById('q-combo');
  if(QCombo>=2){combo.style.display='block';combo.textContent=`🔥 コンボ ×${QCombo}`;}
  else{combo.style.display='none';}
  isAnswered=false;

  const grid=document.getElementById('choices-grid');
  grid.innerHTML='';
  q.c.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='choice-btn qIn';
    btn.style.animationDelay=(i*.07)+'s';
    btn.textContent=c;
    btn.addEventListener('click',()=>checkAnswer(i,q.a,btn,q));
    grid.appendChild(btn);
  });
}

function checkAnswer(chosen,correct,btn,q){
  if(isAnswered)return;
  isAnswered=true;
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  const allBtns=document.querySelectorAll('.choice-btn');

  if(chosen===correct){
    btn.classList.add('correct');
    QCombo++;
    let gain=XPD[QDiff];
    if(QCombo>=5) gain+=15;
    else if(QCombo>=3) gain+=5;
    QXp+=gain;
    QScore++;
    document.getElementById('qz-xp-badge').textContent=`+${QXp} XP`;
    showExpPanel(true,q.c[correct],q.exp);
  } else {
    btn.classList.add('wrong');
    allBtns[correct].classList.add('correct');
    QCombo=0;
    showExpPanel(false,q.c[correct],q.exp);
  }
}

function showExpPanel(correct,ans,exp){
  document.getElementById('exp-mark').textContent=correct?'✅ 正解！':'❌ 不正解…';
  document.getElementById('exp-mark').style.color=correct?'#6bcb77':'#ff6b6b';
  document.getElementById('exp-correct-ans').textContent='正解：'+ans;
  document.getElementById('exp-text').textContent=exp;
  const last=document.querySelector('.exp-next-btn');
  last.textContent=QI+1>=QQ.length?'結果を見る ▶':'次の問題へ ▶';
  document.getElementById('exp-panel').classList.add('show');
}

function nextQuestion(){
  document.getElementById('exp-panel').classList.remove('show');
  QI++;
  setTimeout(()=>showQ(),150);
}

function finishQuiz(){
  const tot=QQ.length;
  if(QScore>=tot) QXp+=50;
  sv.xp+=QXp;
  const prev=(sv.bq[CE.id]||{})[QDiff]||0;
  if(!sv.bq[CE.id])sv.bq[CE.id]={};
  sv.bq[CE.id][QDiff]=Math.max(prev,QScore);
  save();

  const pct=QScore/tot;
  const stars=pct>=1?'⭐⭐⭐':pct>=.75?'⭐⭐':pct>=.5?'⭐':'';
  const msgs=['もう少し！問題の解説をよく読もう','基礎は理解できてきた！繰り返して定着させよう','よくできました！もう少しで満点！','素晴らしい！あなたは本物の歴史家！','完璧！真の天下人の知識を持っている！'];
  const mi=pct>=1?4:pct>=.75?3:pct>=.5?2:pct>=.25?1:0;

  document.getElementById('res-era').textContent=CE.icon+' '+CE.title+'　'+DNAMES[QDiff];
  document.getElementById('res-title').textContent=QScore>=tot?'パーフェクト！🎊':'クイズ完了！';
  document.getElementById('res-correct').textContent=QScore;
  document.getElementById('res-total').textContent=' / '+tot;
  document.getElementById('res-stars').textContent=stars;
  document.getElementById('res-xp').textContent=QXp;
  document.getElementById('res-msg').textContent=msgs[mi];
  document.getElementById('res-era').style.color=CE.ec;
  document.getElementById('res-title').style.color=CE.ec;

  showScreen('result');
  if(QScore>=tot) launchConfetti();

  // アチーブメントチェック
  checkAchievements();
  renderHome();
}

function checkAchievements(){
  const total=ERAS.reduce((s,e)=>s+e.quiz.easy.length,0);
  if(!sv.ach) sv.ach={};
  const achs=[
    {id:'first',c:()=>QScore>0,msg:'🏆 初陣！ 最初の正解'},
    {id:'perfect',c:()=>QScore>=QQ.length,msg:'💎 パーフェクト！ 全問正解'},
    {id:'hard_clear',c:()=>QDiff==='hard'&&QScore>=QQ.length,msg:'👑 上級完全制覇！'},
    {id:'lv5',c:()=>lv()>=5,msg:'⚔️ Lv.5達成！ 大名の称号'},
    {id:'lv10',c:()=>lv()>=10,msg:'🌟 Lv.10！ 天下人の称号'},
    {id:'combo5',c:()=>QCombo>=5,msg:'🔥 コンボ×5達成！'},
    {id:'allera',c:()=>ERAS.every(e=>(sv.bq[e.id]||{}).easy>0),msg:'📚 全時代制覇！'},
    {id:'str7',c:()=>sv.str>=7,msg:'🌙 7日連続ログイン！'},
  ];
  achs.forEach(a=>{
    if(!sv.ach[a.id]&&a.c()){
      sv.ach[a.id]=true; save();
      setTimeout(()=>showAchievement(a.msg),600);
    }
  });
}

function showAchievement(msg){
  const p=document.getElementById('ach-popup');
  document.getElementById('ach-txt').textContent=msg;
  p.classList.add('show');
  setTimeout(()=>p.classList.remove('show'),3000);
}

// ═══════════════════════════════════════
//  ユーティリティ
// ═══════════════════════════════════════
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelector('#screen-'+name+' .s-body')&&(document.querySelector('#screen-'+name+' .s-body').scrollTop=0);
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function launchConfetti(){
  const wrap=document.getElementById('confetti-wrap');
  wrap.innerHTML='';
  const cols=['#c9a227','#ffd700','#ff6b6b','#4d96ff','#6bcb77','#c77dff','#ff9f43','#fff'];
  for(let i=0;i<90;i++){
    const el=document.createElement('div');
    el.className='cp';
    const sz=5+Math.random()*10;
    el.style.cssText=[`left:${Math.random()*100}vw`,`width:${sz}px`,`height:${sz}px`,
      `background:${cols[Math.floor(Math.random()*cols.length)]}`,
      `border-radius:${Math.random()>.5?'50%':'3px'}`,
      `animation-duration:${1.5+Math.random()*2.5}s`,
      `animation-delay:${Math.random()*.5}s`].join(';');
    wrap.appendChild(el);
  }
  setTimeout(()=>{wrap.innerHTML='';},4500);
}

// 起動
renderHome();
</script>
