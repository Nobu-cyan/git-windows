<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>日本地理 大冒険</title>
<style>
:root{
  --bg:#06080d;--card:rgba(255,255,255,.06);
  --border:rgba(100,180,255,.18);
  --gold:#f5c842;--cream:#f0e8d8;--muted:rgba(240,232,216,.48);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  background:var(--bg);color:var(--cream);user-select:none}
button{cursor:pointer;font-family:inherit;border:none;outline:none;color:inherit;background:none}
button:active{opacity:.72;transform:scale(.97)}

.screen{display:none;position:fixed;inset:0;flex-direction:column;z-index:1;overflow:hidden}
.screen.active{display:flex}
.s-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.s-body::-webkit-scrollbar{display:none}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px 10px;flex-shrink:0;
  background:rgba(6,8,13,.95);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.back-btn{
  padding:6px 13px;border-radius:20px;
  background:rgba(255,255,255,.07);font-size:.8rem;color:var(--muted);
  flex-shrink:0;border:1px solid rgba(255,255,255,.08);
}
.topbar-title{font-size:.98rem;font-weight:900;color:var(--gold);letter-spacing:.06em;flex:1}
.topbar-right{font-size:.76rem;color:var(--muted)}

/* HOME */
#screen-home{background:linear-gradient(170deg,#06080d 0%,#07101e 100%)}
#screen-home::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 60% 20%,rgba(100,160,255,.05) 0%,transparent 60%),
             radial-gradient(ellipse at 20% 80%,rgba(245,200,66,.04) 0%,transparent 50%);
}
.home-hero{text-align:center;padding:28px 20px 14px;flex-shrink:0;position:relative}
.home-ttl{
  font-size:clamp(2.2rem,10vw,3.5rem);font-weight:900;
  color:var(--gold);letter-spacing:.12em;
  text-shadow:0 0 40px rgba(245,200,66,.4),0 2px 12px rgba(0,0,0,.8);
  line-height:1.1;
}
.home-sub{font-size:.78rem;color:var(--muted);margin-top:8px;letter-spacing:.14em}
.home-stats{display:flex;justify-content:center;gap:8px;margin:14px 16px 0;flex-wrap:wrap}
.hstat{
  display:flex;align-items:center;gap:5px;
  padding:5px 14px;border-radius:20px;
  font-size:.78rem;font-weight:800;border:1px solid;
}
.xp-row{margin:10px 18px 0;display:flex;align-items:center;gap:8px}
.xp-bar-bg{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.xp-bar-fg{height:100%;background:linear-gradient(90deg,var(--gold),#ff9500);border-radius:3px;transition:width .5s}
.xp-text{font-size:.65rem;color:var(--muted);white-space:nowrap}

.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 16px 30px}
.menu-card{
  border-radius:var(--r);padding:18px 14px 14px;
  display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  background:var(--card);border:1px solid var(--border);
  position:relative;overflow:hidden;text-align:left;
  transition:transform .18s,box-shadow .18s;
}
.menu-card:active{transform:scale(.93)}
.menu-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
}
.mc-icon{font-size:2rem;line-height:1}
.mc-title{font-size:.92rem;font-weight:900;letter-spacing:.04em}
.mc-sub{font-size:.64rem;color:var(--muted)}
.mc-wide{grid-column:1/-1}
.mc-wide .mc-icon{font-size:2.4rem}
.mc-badge{
  position:absolute;top:8px;right:10px;
  font-size:.6rem;font-weight:800;padding:2px 7px;
  border-radius:10px;background:rgba(245,200,66,.15);
  color:var(--gold);border:1px solid rgba(245,200,66,.3);
}

/* MAP */
#screen-map{background:#090e1a}
.map-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px;overflow:hidden}
#mapSvg{width:100%;height:100%;max-width:480px;max-height:590px}
.region-filter{
  padding:7px 10px;display:flex;gap:5px;overflow-x:auto;flex-shrink:0;
  border-bottom:1px solid var(--border);background:rgba(0,0,0,.25);
}
.region-filter::-webkit-scrollbar{display:none}
.reg-btn{
  padding:4px 11px;border-radius:20px;font-size:.68rem;font-weight:700;
  white-space:nowrap;border:1px solid;opacity:.45;flex-shrink:0;
  transition:opacity .2s;
}
.reg-btn.active{opacity:1}

/* INFO */
#screen-info{background:var(--bg)}
.info-hero-wrap{
  flex-shrink:0;border-bottom:1px solid var(--border);
  position:relative;overflow:hidden;
}
.info-hero-bg{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 80% 50%,var(--hero-col) 0%,transparent 70%);
  opacity:.12;
}
.info-hero{display:flex;align-items:center;gap:14px;padding:18px 16px 14px;position:relative}
.info-emoji-big{font-size:3.4rem;line-height:1;flex-shrink:0}
.info-title-wrap{flex:1}
.info-name{font-size:1.75rem;font-weight:900;letter-spacing:.08em}
.info-read{font-size:.76rem;color:var(--muted);letter-spacing:.1em}
.info-num{font-size:.68rem;color:var(--muted)}
.info-reg-tag{
  display:inline-block;margin-top:5px;
  padding:3px 12px;border-radius:20px;font-size:.65rem;font-weight:800;
  letter-spacing:.06em;border:1px solid;
}
.info-cards{padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.ic-label{font-size:.6rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.ic-val{font-size:1rem;font-weight:700}
.ic-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ic-chip{padding:4px 11px;border-radius:20px;font-size:.72rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.ic-fact-text{font-size:.88rem;line-height:1.65;margin-top:2px}
.info-quiz-btn{
  margin:8px 16px 20px;padding:14px;border-radius:var(--r);
  background:linear-gradient(135deg,var(--gold),#ff9500);
  color:#1a0800;font-size:.92rem;font-weight:900;letter-spacing:.06em;
  text-align:center;width:calc(100% - 32px);display:block;
}

/* CARDS */
#screen-cards{background:var(--bg)}
.cards-filter{
  padding:7px 10px;display:flex;gap:5px;overflow-x:auto;flex-shrink:0;
  border-bottom:1px solid var(--border);background:rgba(0,0,0,.2);
}
.cards-filter::-webkit-scrollbar{display:none}
.cf-btn{
  padding:4px 11px;border-radius:20px;font-size:.68rem;font-weight:700;
  border:1px solid;white-space:nowrap;opacity:.45;flex-shrink:0;transition:opacity .2s;
}
.cf-btn.active{opacity:1}
.cards-grid{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pref-card{
  border-radius:var(--r);padding:13px 12px 11px;
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  background:var(--card);border:1px solid var(--border);
  position:relative;overflow:hidden;transition:transform .18s;text-align:left;
}
.pref-card:active{transform:scale(.93)}
.pc-emoji{font-size:1.7rem;line-height:1;margin-bottom:2px}
.pc-name{font-size:.92rem;font-weight:900}
.pc-read{font-size:.62rem;color:var(--muted)}
.pc-cap{font-size:.7rem;margin-top:3px;color:var(--muted)}

/* REGION LIST */
#screen-region{background:var(--bg)}
.reg-list{padding:12px 16px 30px;display:flex;flex-direction:column;gap:10px}
.reg-card{
  border-radius:var(--r);padding:14px 14px;
  background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;gap:12px;transition:transform .18s;text-align:left;width:100%;
}
.reg-card:active{transform:scale(.97)}
.reg-color-bar{width:5px;height:50px;border-radius:3px;flex-shrink:0}
.reg-info{flex:1;min-width:0}
.reg-name{font-size:1rem;font-weight:900;margin-bottom:3px}
.reg-pref-names{font-size:.65rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg-count{font-size:1.3rem;font-weight:900;color:var(--gold);flex-shrink:0}
.reg-count span{font-size:.65rem;color:var(--muted)}

/* QUIZ SELECT */
#screen-quiz-sel{background:var(--bg)}
.qs-body{padding:14px 16px 30px}
.qs-section{font-size:.68rem;color:var(--muted);letter-spacing:.12em;margin-bottom:10px;margin-top:4px}
.qs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.qs-card{
  padding:16px 12px 14px;border-radius:var(--r);
  background:var(--card);border:2px solid var(--border);
  text-align:center;transition:transform .18s,border-color .2s,background .2s;
}
.qs-card:active{transform:scale(.93)}
.qs-card.sel{border-color:var(--gold);background:rgba(245,200,66,.1)}
.qs-icon{font-size:1.8rem;margin-bottom:6px}
.qs-name{font-size:.82rem;font-weight:900;margin-bottom:2px}
.qs-desc{font-size:.63rem;color:var(--muted)}
.qs-diff-wrap{display:flex;gap:8px;margin-bottom:16px}
.qs-diff-btn{
  flex:1;padding:11px 8px;border-radius:10px;font-size:.77rem;font-weight:800;
  background:var(--card);border:2px solid var(--border);text-align:center;
  transition:border-color .2s,color .2s;line-height:1.4;
}
.qs-diff-btn.sel{border-color:var(--gold);color:var(--gold)}
.qs-start-btn{
  width:100%;padding:15px;border-radius:var(--r);
  background:linear-gradient(135deg,var(--gold),#ff9500);
  color:#1a0800;font-size:1rem;font-weight:900;letter-spacing:.08em;
}

/* QUIZ */
#screen-quiz{background:var(--bg)}
.quiz-hdr{
  padding:10px 14px 8px;flex-shrink:0;
  background:rgba(0,0,0,.2);border-bottom:1px solid var(--border);
}
.quiz-progress-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.q-prog-bg{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.q-prog-fg{height:100%;background:var(--gold);border-radius:3px;transition:width .35s}
.q-prog-txt{font-size:.7rem;color:var(--muted);white-space:nowrap}
.quiz-meta{display:flex;justify-content:space-between;align-items:center}
.quiz-type-label{font-size:.64rem;color:var(--muted);letter-spacing:.08em}
.quiz-streak-lbl{font-size:.76rem;color:#ff9500;font-weight:900}
.quiz-question{padding:13px 16px 10px;flex-shrink:0}
.quiz-q-text{font-size:1.1rem;font-weight:900;line-height:1.4}
.quiz-q-hint{font-size:.76rem;color:var(--muted);margin-top:4px}
.quiz-map-zone{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:4px;min-height:0}
.quiz-opts{
  padding:10px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0;
}
.opt-btn{
  padding:12px 10px;border-radius:10px;
  font-size:.84rem;font-weight:800;letter-spacing:.03em;
  background:var(--card);border:2px solid var(--border);
  transition:background .15s,border-color .15s,transform .15s;
  line-height:1.35;text-align:center;
}
.opt-btn:active{transform:scale(.94)}
.opt-btn.correct{background:rgba(74,217,120,.2)!important;border-color:#4ad978!important;color:#4ad978!important}
.opt-btn.wrong{background:rgba(217,74,74,.2)!important;border-color:#d94a4a!important;color:#d94a4a!important}
.opt-btn:disabled{cursor:default;transform:none}

/* RESULT */
#screen-result{background:linear-gradient(170deg,#06080d,#080d1a);align-items:center;justify-content:center}
.res-wrap{padding:24px 20px;text-align:center;width:100%;max-width:420px}
.res-big{font-size:5rem;line-height:1;margin-bottom:10px}
.res-title{font-size:1.6rem;font-weight:900;color:var(--gold);margin-bottom:2px}
.res-score{font-size:3rem;font-weight:900;margin:10px 0 4px}
.res-xp{font-size:1rem;color:#f5c842;font-weight:800;margin-bottom:16px}
.res-stat-row{
  display:flex;justify-content:center;gap:0;margin-bottom:22px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
}
.res-stat{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 8px;border-right:1px solid var(--border)}
.res-stat:last-child{border-right:none}
.rs-val{font-size:1.4rem;font-weight:900;color:var(--gold)}
.rs-lbl{font-size:.6rem;color:var(--muted)}
.res-btns{display:flex;flex-direction:column;gap:10px}
.res-btn{padding:14px;border-radius:var(--r);font-size:.92rem;font-weight:900;letter-spacing:.06em;width:100%}
.res-btn-main{background:linear-gradient(135deg,var(--gold),#ff9500);color:#1a0800}
.res-btn-sub{background:var(--card);border:1px solid var(--border);color:var(--cream)}

/* FLASH FEEDBACK */
.flash{
  position:fixed;inset:0;z-index:900;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .12s;
}
.flash.show{opacity:1}
.flash-txt{font-size:4rem;font-weight:900;text-shadow:0 0 24px currentColor}

/* STREAK POPUP */
.streak-popup{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) scale(.8) translateY(-10px);
  z-index:800;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,140,0,.9),rgba(255,80,0,.9));
  padding:10px 22px;border-radius:30px;
  font-size:1rem;font-weight:900;color:#fff;
  opacity:0;transition:all .3s;white-space:nowrap;
  box-shadow:0 4px 20px rgba(255,100,0,.5);
}
.streak-popup.show{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}

/* LEVEL UP */
.levelup-overlay{
  position:fixed;inset:0;z-index:950;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .3s;
}
.levelup-overlay.show{opacity:1}
.levelup-box{
  background:linear-gradient(135deg,rgba(245,200,66,.95),rgba(255,150,0,.95));
  padding:24px 36px;border-radius:20px;text-align:center;
  color:#1a0800;box-shadow:0 8px 40px rgba(245,200,66,.6);
}
.lu-title{font-size:.9rem;font-weight:900;letter-spacing:.1em;margin-bottom:4px}
.lu-lv{font-size:3rem;font-weight:900;line-height:1}
</style>
</head>
<body>

<!-- Flash & popups -->
<div class="flash" id="flash"><span class="flash-txt" id="flashTxt">⭕</span></div>
<div class="streak-popup" id="streakPop"></div>
<div class="levelup-overlay" id="lvupOverlay">
  <div class="levelup-box">
    <div class="lu-title">⭐ LEVEL UP!</div>
    <div class="lu-lv" id="lvupNum">LV2</div>
  </div>
</div>

<!-- ═══ HOME ═══ -->
<div id="screen-home" class="screen active">
  <div class="home-hero">
    <div class="home-ttl">日本地理<br>大冒険</div>
    <div class="home-sub">47都道府県を探求しよう！</div>
    <div class="home-stats">
      <div class="hstat" id="hstatLv" style="color:#f5c842;border-color:#f5c842">⭐ LV 1</div>
      <div class="hstat" id="hstatStreak" style="color:#ff9500;border-color:#ff9500">🔥 0日</div>
      <div class="hstat" id="hstatXp" style="color:#4ad978;border-color:#4ad978">XP 0</div>
    </div>
    <div class="xp-row">
      <div class="xp-bar-bg"><div class="xp-bar-fg" id="homeXpBar" style="width:0%"></div></div>
      <div class="xp-text" id="homeXpText">0/100 XP</div>
    </div>
  </div>
  <div class="s-body">
    <div class="menu-grid">
      <button class="menu-card mc-wide" onclick="goMap()">
        <div class="mc-icon">🗾</div>
        <div class="mc-title">地図で学ぶ</div>
        <div class="mc-sub">47都道府県をタップして探検！</div>
        <div class="mc-badge">NEW</div>
      </button>
      <button class="menu-card" onclick="showScreen('screen-quiz-sel')">
        <div class="mc-icon">🧩</div>
        <div class="mc-title">クイズ</div>
        <div class="mc-sub">4種類で腕試し</div>
      </button>
      <button class="menu-card" onclick="showScreen('screen-cards')">
        <div class="mc-icon">📖</div>
        <div class="mc-title">都道府県カード</div>
        <div class="mc-sub">全47件を一覧で</div>
      </button>
      <button class="menu-card" onclick="showScreen('screen-region')">
        <div class="mc-icon">🏔️</div>
        <div class="mc-title">地方別</div>
        <div class="mc-sub">8地方に分けて学ぶ</div>
      </button>
    </div>
  </div>
</div>

<!-- ═══ MAP ═══ -->
<div id="screen-map" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('screen-home')">◀ ホーム</button>
    <div class="topbar-title">🗾 日本地図</div>
    <div class="topbar-right">タップで詳細</div>
  </div>
  <div class="region-filter" id="regionFilter"></div>
  <div class="map-wrap">
    <svg id="mapSvg" viewBox="0 0 640 710" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<!-- ═══ INFO ═══ -->
<div id="screen-info" class="screen">
  <div class="topbar">
    <button class="back-btn" id="infoBackBtn" onclick="goBack()">◀ 戻る</button>
    <div class="topbar-title" id="infoTopTitle"></div>
  </div>
  <div class="s-body">
    <div class="info-hero-wrap">
      <div class="info-hero-bg" id="infoHeroBg"></div>
      <div class="info-hero" id="infoHero"></div>
    </div>
    <div class="info-cards" id="infoCards"></div>
    <button class="info-quiz-btn" onclick="quickQuiz()">📝 この県のクイズに挑戦！</button>
  </div>
</div>

<!-- ═══ CARDS ═══ -->
<div id="screen-cards" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('screen-home')">◀ ホーム</button>
    <div class="topbar-title">📖 都道府県カード</div>
    <div class="topbar-right" id="cardsCount">47件</div>
  </div>
  <div class="cards-filter" id="cardsFilter"></div>
  <div class="s-body">
    <div class="cards-grid" id="cardsGrid"></div>
  </div>
</div>

<!-- ═══ REGION ═══ -->
<div id="screen-region" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('screen-home')">◀ ホーム</button>
    <div class="topbar-title">🏔️ 地方別</div>
  </div>
  <div class="s-body">
    <div class="reg-list" id="regList"></div>
  </div>
</div>

<!-- ═══ QUIZ SELECT ═══ -->
<div id="screen-quiz-sel" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('screen-home')">◀ ホーム</button>
    <div class="topbar-title">🧩 クイズ選択</div>
  </div>
  <div class="s-body">
    <div class="qs-body">
      <div class="qs-section">クイズの種類</div>
      <div class="qs-grid" id="quizSelGrid"></div>
      <div class="qs-section">問題数・難易度</div>
      <div class="qs-diff-wrap" id="diffWrap"></div>
      <button class="qs-start-btn" onclick="startQuiz()">スタート！</button>
    </div>
  </div>
</div>

<!-- ═══ QUIZ ═══ -->
<div id="screen-quiz" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="quitQuiz()">✕ やめる</button>
    <div class="topbar-title" id="quizTitle">クイズ</div>
    <div class="topbar-right" id="quizScoreLbl">0点</div>
  </div>
  <div class="quiz-hdr">
    <div class="quiz-progress-row">
      <div class="q-prog-bg"><div class="q-prog-fg" id="quizProgBar" style="width:0%"></div></div>
      <div class="q-prog-txt" id="quizProgTxt">1/10</div>
    </div>
    <div class="quiz-meta">
      <div class="quiz-type-label" id="quizTypeLabel"></div>
      <div class="quiz-streak-lbl" id="quizStreakLbl"></div>
    </div>
  </div>
  <div class="quiz-question" id="quizQuestion">
    <div class="quiz-q-text" id="quizQText"></div>
    <div class="quiz-q-hint" id="quizQHint"></div>
  </div>
  <div class="quiz-map-zone" id="quizMapZone" style="display:none">
    <svg id="quizMapSvg" viewBox="0 0 640 710" xmlns="http://www.w3.org/2000/svg"
      style="width:100%;height:100%;max-width:440px"></svg>

// ═══════════════════════════════════════════════════════
// SVG MAP RENDERING
// ═══════════════════════════════════════════════════════
function renderMap(svgId, quizMode, highlightId, correctId){
  const svg = document.getElementById(svgId);
  if(!svg) return;
  svg.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';

  // Sea background
  const bg = document.createElementNS(NS,'rect');
  Object.entries({width:640,height:710,fill:'#0a1422'}).forEach(([k,v])=>bg.setAttribute(k,v));
  svg.appendChild(bg);

  // Dot pattern for sea
  const defs = document.createElementNS(NS,'defs');
  defs.innerHTML = `<pattern id="sp_${svgId}" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="9" cy="9" r=".7" fill="rgba(100,160,220,.14)"/>
  </pattern>`;
  svg.appendChild(defs);
  const dotBg = document.createElementNS(NS,'rect');
  Object.entries({width:640,height:710,fill:`url(#sp_${svgId})`}).forEach(([k,v])=>dotBg.setAttribute(k,v));
  svg.appendChild(dotBg);

  // Okinawa inset frame (lower-right — empty ocean area)
  const insetRect = document.createElementNS(NS,'rect');
  Object.entries({x:472,y:622,width:162,height:62,rx:5,fill:'rgba(8,16,36,.9)',stroke:'rgba(100,160,220,.3)','stroke-width':1}).forEach(([k,v])=>insetRect.setAttribute(k,v));
  svg.appendChild(insetRect);
  const insetLbl = document.createElementNS(NS,'text');
  Object.entries({x:553,y:630,'text-anchor':'middle','font-size':5.5,'font-family':'sans-serif',fill:'rgba(180,210,255,.4)'}).forEach(([k,v])=>insetLbl.setAttribute(k,v));
  insetLbl.textContent = '▲実際はもっと南西';
  svg.appendChild(insetLbl);

  // Draw each prefecture
  PREFS.forEach(p => {
    const isActive  = activeRegion === 'all' || activeRegion === p.reg;
    const isHighlight = p.id === highlightId;
    const isCorrect   = p.id === correctId;
    const col = REG_COLORS[p.reg];

    // Path data
    const pathD = p.id === 'okinawa' ? p.insetPath : (p.shape ? toPath(p.shape) : null);
    if(!pathD) return;

    // SVG-space centre for label
    const ctr = p.id === 'okinawa'
      ? p.insetLabel
      : (()=>{ const c=pCtr(p.shape); return [px(c[0]), py(c[1])]; })();

    // Approximate width for font-size
    const shapeW = p.shape
      ? Math.max(...p.shape.map(pt=>px(pt[0]))) - Math.min(...p.shape.map(pt=>px(pt[0])))
      : 40;
    const fs = Math.max(5.5, Math.min(9.5, shapeW / Math.max(p.name.length, 1) * 0.55));

    // Pulse glow for quiz highlight
    if(quizMode && isHighlight){
      const glow = document.createElementNS(NS,'path');
      glow.setAttribute('d', pathD);
      glow.setAttribute('fill', col);
      glow.setAttribute('opacity', '.2');
      glow.setAttribute('stroke', col);
      glow.setAttribute('stroke-width', '10');
      glow.setAttribute('stroke-linejoin', 'round');
      glow.innerHTML = '<animate attributeName="opacity" values=".08;.35;.08" dur="1.2s" repeatCount="indefinite"/>';
      svg.appendChild(glow);
    }

    // Main path
    const path = document.createElementNS(NS,'path');
    path.setAttribute('d', pathD);
    path.setAttribute('stroke-linejoin', 'round');

    if(!isActive){
      path.setAttribute('fill','rgba(80,100,130,.2)');
      path.setAttribute('stroke','rgba(80,100,130,.25)');
      path.setAttribute('stroke-width','0.5');
    } else if(isCorrect){
      path.setAttribute('fill','rgba(74,217,120,.85)');
      path.setAttribute('stroke','#4ad978');
      path.setAttribute('stroke-width','1.5');
    } else {
      path.setAttribute('fill', col);
      path.setAttribute('fill-opacity','.78');
      path.setAttribute('stroke','rgba(0,0,0,.5)');
      path.setAttribute('stroke-width','1');
    }

    if(!quizMode && isActive){
      path.style.cursor = 'pointer';
      path.addEventListener('click',()=>openPref(p.id,'screen-map'));
    } else if(quizMode && quizType === 'map' && !quizAnswered && !correctId){
      path.style.cursor = 'pointer';
      path.addEventListener('click',()=>quizMapClick(p.id));
    }
    svg.appendChild(path);

    // Label
    if(isActive){
      const txtEl = document.createElementNS(NS,'text');
      Object.entries({
        x:ctr[0], y:ctr[1],
        'text-anchor':'middle','dominant-baseline':'middle',
        fill:'rgba(255,255,255,.92)','font-weight':'700',
        'font-size':fs,'font-family':'-apple-system,sans-serif',
        'pointer-events':'none'
      }).forEach(([k,v])=>txtEl.setAttribute(k,v));
      txtEl.textContent = p.name;
      svg.appendChild(txtEl);
    }
  });
}

// ═══════════════════════════════════════════════════════
// MAP REGION FILTER
// ═══════════════════════════════════════════════════════
function renderMapFilter(){
  const rf = document.getElementById('regionFilter');
  if(rf.children.length > 0) return; // already built
  // All button
  const allBtn = makeRegBtn('all','全て','rgba(200,220,255,.7)','rgba(200,220,255,.3)');
  allBtn.classList.add('active');
  allBtn.onclick = ()=> filterMap('all', allBtn);
  rf.appendChild(allBtn);
  Object.entries(REG_NAMES).forEach(([k,v])=>{
    const btn = makeRegBtn(k, v, REG_COLORS[k], REG_COLORS[k]);
    btn.onclick = ()=> filterMap(k, btn);
    rf.appendChild(btn);
  });
}
function makeRegBtn(k, label, color, border){
  const btn = document.createElement('button');
  btn.className = 'reg-btn'; btn.dataset.reg = k;
  btn.style.color = color; btn.style.borderColor = border;
  btn.textContent = label;
  return btn;
}
function filterMap(reg, btn){
  activeRegion = reg;
  document.querySelectorAll('#regionFilter .reg-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderMap('mapSvg', false);
}

// ═══════════════════════════════════════════════════════
// PREFECTURE INFO
// ═══════════════════════════════════════════════════════
function openPref(id, from){
  prevScreen = from || 'screen-home';
  const p = PREFS.find(x=>x.id===id);
  if(!p) return;
  lastOpenPrefId = id;
  const col = REG_COLORS[p.reg];

  document.getElementById('infoTopTitle').textContent = p.name;
  document.getElementById('infoBackBtn').textContent  = '◀ ' + (from==='screen-map' ? '地図' : from==='screen-cards' ? '一覧' : '戻る');

  // Hero bg color
  const bgEl = document.getElementById('infoHeroBg');
  bgEl.style.setProperty('--hero-col', col);
  bgEl.style.background = `radial-gradient(ellipse at 80% 50%, ${col} 0%, transparent 70%)`;

  document.getElementById('infoHero').innerHTML = `
    <div style="font-size:3.4rem;line-height:1;flex-shrink:0">${p.emoji}</div>
    <div style="flex:1">
      <div class="info-name" style="color:${col}">${p.name}</div>
      <div class="info-read">${p.read}（${p.rom}）</div>
      <div class="info-num">都道府県番号：第 ${p.num} 号</div>
      <div class="info-reg-tag" style="color:${col};border-color:${col}">${REG_FULL[p.reg]}</div>
    </div>
  `;

  document.getElementById('infoCards').innerHTML = `
    <div class="info-card">
      <div class="ic-label">🏛 県庁所在地</div>
      <div class="ic-val" style="color:${col}">${p.cap}</div>
    </div>
    <div class="info-card">
      <div class="ic-label">🍜 名産・グルメ</div>
      <div class="ic-chips">${p.food.map(f=>`<div class="ic-chip">${f}</div>`).join('')}</div>
    </div>
    <div class="info-card">
      <div class="ic-label">🏔️ 観光スポット</div>
      <div class="ic-val" style="font-size:.88rem;line-height:1.6;margin-top:2px">${p.spot}</div>
    </div>
    <div class="info-card" style="border-color:${col}44;background:${col}12">
      <div class="ic-label">💡 豆知識</div>
      <div class="ic-fact-text">${p.fact}</div>
    </div>
  `;

  showScreen('screen-info');
}

function quickQuiz(){
  quizType = 'capital';
  quizDiff = 10;
  startQuiz();
}

// ═══════════════════════════════════════════════════════
// CARDS
// ═══════════════════════════════════════════════════════
function buildCardsFilter(){
  const cf = document.getElementById('cardsFilter');
  const allBtn = document.createElement('button');
  allBtn.className = 'cf-btn active'; allBtn.dataset.reg = 'all';
  allBtn.style.color = 'rgba(200,220,255,.8)'; allBtn.style.borderColor = 'rgba(200,220,255,.4)';
  allBtn.textContent = '全て';
  allBtn.onclick = ()=>{ filterCards('all',allBtn); };
  cf.appendChild(allBtn);
  Object.entries(REG_NAMES).forEach(([k,v])=>{
    const btn = document.createElement('button');
    btn.className='cf-btn'; btn.dataset.reg=k;
    btn.style.color=REG_COLORS[k]; btn.style.borderColor=REG_COLORS[k];
    btn.textContent=v;
    btn.onclick=()=>{ filterCards(k,btn); };
    cf.appendChild(btn);
  });
}
function filterCards(reg, btn){
  document.querySelectorAll('.cf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildCards(reg);
}
function buildCards(reg='all'){
  const list = reg==='all' ? PREFS : PREFS.filter(p=>p.reg===reg);
  document.getElementById('cardsCount').textContent = list.length + '件';
  document.getElementById('cardsGrid').innerHTML = list.map(p=>`
    <button class="pref-card" onclick="openPref('${p.id}','screen-cards')">
      <div class="pc-emoji">${p.emoji}</div>
      <div class="pc-name" style="color:${REG_COLORS[p.reg]}">${p.name}</div>
      <div class="pc-read">${p.read}</div>
      <div class="pc-cap">🏛 ${p.cap}</div>
    </button>
  `).join('');
}

// ═══════════════════════════════════════════════════════
// REGION LIST
// ═══════════════════════════════════════════════════════
function buildRegionList(){
  document.getElementById('regList').innerHTML = Object.entries(REG_FULL).map(([k,v])=>{
    const prefs = PREFS.filter(p=>p.reg===k);
    return `
      <button class="reg-card" onclick="goRegionCards('${k}')">
        <div class="reg-color-bar" style="background:${REG_COLORS[k]}"></div>
        <div class="reg-info">
          <div class="reg-name" style="color:${REG_COLORS[k]}">${v}</div>
          <div class="reg-pref-names">${prefs.map(p=>p.name).join('・')}</div>
        </div>
        <div class="reg-count">${prefs.length}<span>県</span></div>
      </button>
    `;
  }).join('');
}
function goRegionCards(reg){
  showScreen('screen-cards');
  const btn = document.querySelector(`#cardsFilter [data-reg="${reg}"]`);
  if(btn) filterCards(reg, btn);
}

// ═══════════════════════════════════════════════════════
// QUIZ SELECT
// ═══════════════════════════════════════════════════════
const QUIZ_TYPES = [
  {id:'map',    icon:'🗺️', name:'地図クイズ',   desc:'県名を見て地図上の場所を探そう'},
  {id:'name',   icon:'📍', name:'名前クイズ',   desc:'地図上の県の名前を当てよう'},
  {id:'capital',icon:'🏛️', name:'県庁所在地',   desc:'都道府県の県庁所在地を当てよう'},
  {id:'food',   icon:'🍜', name:'名産クイズ',   desc:'名産品から都道府県を当てよう'},
];
const QUIZ_DIFFS = [
  {n:10,  label:'🌱 かんたん', sub:'10問'},
  {n:20,  label:'🌿 ふつう',   sub:'20問'},
  {n:47,  label:'🌳 むずかしい',sub:'全47問'},
];

function buildQuizSel(){
  const grid = document.getElementById('quizSelGrid');
  QUIZ_TYPES.forEach((q,i)=>{
    const btn = document.createElement('button');
    btn.className = 'qs-card' + (i===0?' sel':'');
    btn.innerHTML = `<div class="qs-icon">${q.icon}</div><div class="qs-name">${q.name}</div><div class="qs-desc">${q.desc}</div>`;
    btn.onclick = ()=>{
      document.querySelectorAll('.qs-card').forEach(c=>c.classList.remove('sel'));
      btn.classList.add('sel');
      quizType = q.id;
    };
    grid.appendChild(btn);
  });
  const dw = document.getElementById('diffWrap');
  QUIZ_DIFFS.forEach((d,i)=>{
    const btn = document.createElement('button');
    btn.className = 'qs-diff-btn' + (i===0?' sel':'');
    btn.innerHTML = `${d.label}<br><small>${d.sub}</small>`;
    btn.onclick = ()=>{
      document.querySelectorAll('.qs-diff-btn').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
      quizDiff = d.n;
    };
    dw.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════════════
// QUIZ LOGIC
// ═══════════════════════════════════════════════════════
function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }
function randN(arr,n){ return shuffle(arr).slice(0,n); }
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function startQuiz(){
  lastQuizType = quizType;
  lastQuizDiff = quizDiff;
  quizIdx = 0; quizScore = 0; quizStreak = 0; maxStreak = 0; quizAnswered = false;
  quizQueue = randN(PREFS, Math.min(quizDiff, PREFS.length));
  showScreen('screen-quiz');
  updateQuizProgress();
  nextQuestion();
}

function nextQuestion(){
  if(quizIdx >= quizQueue.length){ showResult(); return; }
  const p = quizQueue[quizIdx];
  quizCurrentPref = p;
  quizAnswered = false;

  const qt = QUIZ_TYPES.find(t=>t.id===quizType);
  document.getElementById('quizTitle').textContent     = qt.name;
  document.getElementById('quizTypeLabel').textContent = qt.icon + ' ' + qt.name;
  document.getElementById('quizScoreLbl').textContent  = quizScore + '点';
  updateQuizProgress();

  const zone = document.getElementById('quizMapZone');
  const opts = document.getElementById('quizOpts');

  if(quizType === 'map'){
    document.getElementById('quizQText').textContent = `「${p.name}」はどこ？`;
    document.getElementById('quizQHint').textContent = p.read + '　' + REG_FULL[p.reg];
    zone.style.display = 'flex'; opts.style.display = 'none';
    renderMap('quizMapSvg', true, null, null);
  } else if(quizType === 'name'){
    document.getElementById('quizQText').textContent = 'この都道府県の名前は？';
    document.getElementById('quizQHint').textContent = p.emoji + '　ヒント：' + REG_FULL[p.reg];
    zone.style.display = 'flex'; opts.style.display = 'grid';
    renderMap('quizMapSvg', true, p.id, null);
    buildOptions(p, 'name');
  } else if(quizType === 'capital'){
    document.getElementById('quizQText').textContent = `「${p.name}」${p.emoji} の県庁所在地は？`;
    document.getElementById('quizQHint').textContent = REG_FULL[p.reg];
    zone.style.display = 'none'; opts.style.display = 'grid';
    buildOptions(p, 'capital');
  } else if(quizType === 'food'){
    const foodItem = rand(p.food);
    document.getElementById('quizQText').textContent = `「${foodItem}」が有名な都道府県は？`;
    document.getElementById('quizQHint').textContent = 'ヒント：' + REG_FULL[p.reg];
    zone.style.display = 'none'; opts.style.display = 'grid';
    buildOptions(p, 'name');
  }
}

function buildOptions(correct, mode){
  const others = randN(PREFS.filter(p=>p.id!==correct.id), 3);
  const all = shuffle([correct, ...others]);
  const opts = document.getElementById('quizOpts');
  opts.innerHTML = '';
  all.forEach(p=>{
    const label = mode==='capital' ? p.cap : p.name;
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = label;
    btn.dataset.id = p.id;
    btn.addEventListener('click', ()=>checkAnswer(p.id, correct.id));
    opts.appendChild(btn);
  });
}

function checkAnswer(selected, correct){
  if(quizAnswered) return;
  quizAnswered = true;
  const ok = selected === correct;

  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.disabled = true;
    if(btn.dataset.id === correct) btn.classList.add('correct');
    else if(btn.dataset.id === selected && !ok) btn.classList.add('wrong');
  });

  processResult(ok, correct);
}

function quizMapClick(id){
  if(quizAnswered || quizType!=='map') return;
  quizAnswered = true;
  const ok = id === quizCurrentPref.id;
  renderMap('quizMapSvg', true, null, quizCurrentPref.id);
  processResult(ok, quizCurrentPref.id);
}

function processResult(ok, correctId){
  if(ok){
    quizScore++;
    quizStreak++;
    if(quizStreak > maxStreak) maxStreak = quizStreak;
    showFlash('⭕','#4ad978');
    document.getElementById('quizScoreLbl').textContent = quizScore + '点';
    if(quizStreak >= 3){
      showStreakPop(`🔥 ${quizStreak}連続！`);
    }
    document.getElementById('quizStreakLbl').textContent = quizStreak >= 2 ? `🔥×${quizStreak}` : '';
  } else {
    quizStreak = 0;
    showFlash('✕','#d94a4a');
    document.getElementById('quizStreakLbl').textContent = '';
  }
  setTimeout(()=>{ quizIdx++; nextQuestion(); }, ok ? 700 : 1400);
}

function updateQuizProgress(){
  const total = quizQueue.length;
  const pct   = total > 0 ? (quizIdx / total * 100) : 0;
  document.getElementById('quizProgBar').style.width = pct + '%';
  document.getElementById('quizProgTxt').textContent = `${Math.min(quizIdx+1,total)} / ${total}`;
}

function quitQuiz(){
  showScreen('screen-quiz-sel');
}
function retryQuiz(){
  quizType = lastQuizType;
  quizDiff = lastQuizDiff;
  startQuiz();
}

// ═══════════════════════════════════════════════════════
// RESULT
// ═══════════════════════════════════════════════════════
function showResult(){
  const total = quizQueue.length;
  const pct   = Math.round(quizScore / total * 100);

  let earned = quizScore * 10;
  if(pct === 100) earned += 50;
  if(maxStreak >= 5) earned += 20;

  const prevLv = getLevel(xp);
  xp += earned;
  const newLv  = getLevel(xp);

  // Streak date
  const today = new Date().toDateString();
  if(lastDate !== today){ streak++; lastDate = today; }
  saveState();

  let emoji='😢', title='もう少し！';
  if(pct===100){emoji='🏆';title='完璧！！パーフェクト！'}
  else if(pct>=90){emoji='🥇';title='素晴らしい！'}
  else if(pct>=70){emoji='🎉';title='よく頑張った！'}
  else if(pct>=50){emoji='😊';title='まずまず！'}
  else if(pct>=30){emoji='💪';title='もっと学ぼう！'}

  document.getElementById('resBig').textContent   = emoji;
  document.getElementById('resTitle').textContent = title;
  document.getElementById('resScore').textContent = `${quizScore}/${total}`;
  document.getElementById('resXp').textContent    = `+${earned} XP 獲得！`;
  document.getElementById('resAcc').textContent   = pct + '%';
  document.getElementById('resStreak').textContent = maxStreak;
  document.getElementById('resLv').textContent    = 'LV' + newLv;

  showScreen('screen-result');
  updateHome();

  if(newLv > prevLv) setTimeout(()=>showLevelUp(newLv), 600);
}

// ═══════════════════════════════════════════════════════
// FEEDBACK
// ═══════════════════════════════════════════════════════
let flashTO, streakTO, lvTO;

function showFlash(txt, color){
  const el=document.getElementById('flash'), t=document.getElementById('flashTxt');
  clearTimeout(flashTO);
  t.textContent=txt; t.style.color=color;
  el.classList.add('show');
  flashTO=setTimeout(()=>el.classList.remove('show'),550);
}

function showStreakPop(txt){
  const el=document.getElementById('streakPop');
  clearTimeout(streakTO);
  el.textContent=txt;
  el.classList.add('show');
  streakTO=setTimeout(()=>el.classList.remove('show'),1600);
}

function showLevelUp(lv){
  const ov=document.getElementById('lvupOverlay');
  document.getElementById('lvupNum').textContent='LV'+lv;
  ov.classList.add('show');
  lvTO=setTimeout(()=>ov.classList.remove('show'),2200);
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
function init(){
  updateHome();
  buildCardsFilter();
  buildCards();
  buildRegionList();
  buildQuizSel();
}

init();
</script>
