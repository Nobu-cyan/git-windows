<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>勇者伝説III ～ゾーマの城～</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;color:#fff;font-family:'MS Gothic','Courier New',monospace;
     display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;overflow-x:hidden;}
#gc{width:576px;max-width:100vw;background:#000066;border:3px solid #8888ff;}
#mapWrap{position:relative;width:576px;height:384px;overflow:hidden;}
#mapCanvas{display:block;}

/* ========== タッチ操作Dパッド ========== */
#dpad{display:none;justify-content:center;align-items:center;
      padding:6px 0 4px;background:#000044;border-top:2px solid #4444aa;user-select:none;}
#dpadGrid{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:2px;}
.dpadBtn{background:#000066;border:2px solid #8888ff;color:#fff;font-size:18px;
         display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px;
         touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.dpadBtn:active{background:#2222aa;border-color:#ffff44;}
.dpadC{background:#000044;border-color:#333366;cursor:default;}

@media(max-width:600px){
  body{justify-content:flex-start;padding-top:2px;}
  #gc{width:100vw;border-left:none;border-right:none;border-width:2px 0;}
  #mapWrap{width:100vw;height:75vw;}
  #mapWrap canvas{width:100%;height:100%;}
  /* オーバーレイ（クラス選択・タイトル等）をフルスクリーン表示 */
  .overlay{position:fixed;top:0;left:0;width:100vw;height:100dvh;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:50;}
  #dpad{display:flex;}
  #partyBar{gap:2px;padding:2px 3px;flex-wrap:wrap;}
  .charCard{font-size:10px;padding:2px 4px;}
  .charCard .cname{font-size:11px;}
  #msgBox{font-size:11px;min-height:52px;padding:5px 8px;margin:2px 3px;}
  #cmdArea{padding:2px 3px 4px;gap:2px;}
  .btn{font-size:11px;padding:7px 6px;min-width:0;flex:1;}
  #titleOv h1{font-size:20px;letter-spacing:3px;}
  #titleOv h2{font-size:10px;letter-spacing:2px;}
  .startBtn{font-size:13px;padding:9px 22px;letter-spacing:2px;}
  .enemyEmoji{font-size:48px;}
  #battleBg{height:150px;padding:8px 10px;}
  #battleMsg{font-size:11px;min-height:36px;padding:4px 8px;}
  #battleCmds{padding:2px 3px;}
  #battleCmds .btn,#spellPanel .btn,#targetPanel .btn{flex:1;padding:7px 4px;font-size:11px;}
  .ovTitle{font-size:15px;padding:3px 12px;}
  .shopRow{font-size:11px;padding:4px 8px;}
  #shopList{max-height:140px;max-width:100%;}
  .classCard{padding:6px 10px;max-width:100%;width:100%;}
  .classCard .cn{font-size:13px;}
  .classCard .ce{font-size:24px;}
  #classOv{padding:12px 10px 20px;}
  #classList{width:100%;max-width:360px;}
  #storyBody{font-size:11px;}
  #storyTitle{font-size:17px;}
  #menuBody{font-size:11px;}
  #shopList{max-height:45vh;}
  #menuBody{max-height:50vh;overflow-y:auto;}
  #dpadGrid{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);}
  .dpadBtn{font-size:22px;}
}
#partyBar{display:flex;background:#000044;border-top:2px solid #4444aa;padding:4px 6px;gap:6px;}
.charCard{flex:1;background:#000066;border:1px solid #4466aa;padding:4px 6px;font-size:11px;min-width:0;}
.charCard .cname{color:#ffff88;font-size:12px;font-weight:bold;}
.charCard .chp{color:#44ff44;}
.charCard .cmp{color:#44aaff;}
.charCard .cdead{color:#ff4444;}
.hpbar{height:6px;background:#004400;border:1px solid #006600;margin:2px 0;}
.hpbar div{height:100%;background:#44ff44;transition:width .3s;}
.hpbar div.low{background:#ffaa00;}
.hpbar div.crit{background:#ff4444;}
#msgBox{background:#000066;border:2px solid #4444aa;margin:3px 5px;padding:8px 12px;
        min-height:68px;font-size:13px;line-height:1.65;position:relative;}
#msgBox .arr{position:absolute;bottom:4px;right:8px;color:#ffff44;animation:bk .6s infinite;}
@keyframes bk{0%,100%{opacity:1}50%{opacity:0}}
#cmdArea{display:flex;flex-wrap:wrap;gap:3px;padding:3px 5px 6px;}
.btn{background:#000066;color:#fff;border:2px solid #4466ff;padding:5px 12px;
     font-family:inherit;font-size:12px;cursor:pointer;min-width:68px;text-align:center;}
.btn:hover,.btn.sel{background:#2222aa;border-color:#ffff44;color:#ffff44;}
.btn:disabled{opacity:.35;cursor:default;}
.btn.red{border-color:#ff4444;color:#ff8888;}
.btn.grn{border-color:#44ff44;color:#88ff88;}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;
         display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;}
#titleOv{background:linear-gradient(180deg,#000011,#000033 60%,#000011);}
#titleOv h1{font-size:28px;color:#ffff44;text-shadow:2px 2px #884400;letter-spacing:6px;margin-bottom:4px;}
#titleOv h2{font-size:12px;color:#aaaaff;letter-spacing:3px;margin-bottom:6px;}
#titleOv .sub{font-size:11px;color:#6666aa;margin-bottom:28px;}
.startBtn{font-size:15px;padding:10px 32px;letter-spacing:4px;animation:bk 1s infinite;
          background:#000066;border:2px solid #ffff44;color:#fff;cursor:pointer;font-family:inherit;margin:4px;}
.startBtn:hover{background:#0000aa;}
#battleOv{background:#000011;flex-direction:column;}
#battleBg{width:100%;height:200px;display:flex;align-items:flex-end;justify-content:space-around;
          padding:12px 20px;background:linear-gradient(180deg,#001133,#002255 60%,#221100);}
.enemyBlock{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.enemyEmoji{font-size:64px;line-height:1;transition:transform .1s,opacity .3s;}
.enemyEmoji.dead{opacity:.1;transform:scale(.5);}
.enemyEmoji.hit{transform:translateX(-12px);}
.enemyName{font-size:10px;color:#ffaaaa;}
.enemyHpW{width:60px;height:6px;background:#440000;border:1px solid #ff4444;}
.enemyHpI{height:100%;background:#ff4444;transition:width .3s;}
#battleMsg{background:#000066;border:2px solid #4444aa;margin:3px;padding:6px 10px;
           font-size:12px;min-height:44px;line-height:1.6;}
#battleCmds{display:flex;flex-wrap:wrap;gap:3px;padding:3px 5px;}
#spellPanel{display:none;flex-wrap:wrap;gap:3px;padding:3px 5px;}
#targetPanel{display:none;flex-wrap:wrap;gap:3px;padding:3px 5px;}
#battleContBtn{display:none;padding:4px 8px 6px;}
#shopOv{background:rgba(0,0,20,.97);padding:14px;}
.ovTitle{font-size:18px;color:#ffff44;border:2px solid #ffff44;padding:4px 18px;margin-bottom:10px;}
#shopTabs{display:flex;gap:4px;margin-bottom:8px;}
.shopTab{padding:4px 12px;border:1px solid #4466ff;cursor:pointer;font-size:12px;font-family:inherit;background:#000066;color:#fff;}
.shopTab.active{border-color:#ffff44;color:#ffff44;background:#2222aa;}
#shopList{max-height:180px;overflow-y:auto;width:100%;max-width:340px;}
.shopRow{display:flex;justify-content:space-between;padding:5px 10px;border:1px solid #224466;
         margin:2px 0;cursor:pointer;font-size:12px;background:#000044;}
.shopRow:hover{background:#002266;border-color:#ffff44;}
.shopRow .sprice{color:#ffff44;}
.shopRow .sdesc{font-size:10px;color:#8888aa;}
#shopGold{color:#ffff44;font-size:13px;margin:6px 0;}
#innOv{background:rgba(0,0,20,.97);}
#storyOv{background:#000000;padding:24px;text-align:center;}
#storyTitle{font-size:20px;color:#ffff44;margin-bottom:16px;}
#storyBody{font-size:13px;color:#ccccff;line-height:2.1;max-width:420px;margin-bottom:20px;}
#classOv{background:rgba(0,0,20,.97);padding:12px;}
.classCard{display:flex;align-items:flex-start;gap:10px;padding:7px 12px;
           border:1px solid #224466;margin:4px 0;cursor:pointer;background:#000044;width:100%;max-width:380px;}
.classCard:hover{background:#002266;border-color:#ffff44;}
.classCard .ce{font-size:28px;}
.classCard .ci{flex:1;}
.classCard .cn{font-size:14px;color:#ffff88;}
.classCard .cd{font-size:11px;color:#8888aa;margin-top:2px;}
.classCard.chosen{border-color:#44ff44;background:#002200;}
#menuOv{background:rgba(0,0,20,.97);padding:12px;flex-direction:column;align-items:center;}
#menuCharTabs{display:flex;gap:4px;margin-bottom:8px;}
.menuTab{padding:4px 10px;border:1px solid #4466ff;cursor:pointer;font-size:12px;font-family:inherit;background:#000066;color:#fff;}
.menuTab.active{border-color:#ffff44;color:#ffff44;}
#menuBody{width:100%;max-width:380px;font-size:12px;line-height:1.8;}
#menuBody .mrow{display:flex;justify-content:space-between;border-bottom:1px solid #224466;padding:2px 0;}
#menuBody .mrow .ml{color:#aaaaff;}
#menuBody .mrow .mr{color:#fff;}
#gameoverOv{background:#000000;}
#endingOv{background:linear-gradient(180deg,#000022,#000044);}
#nameInput{background:#000066;color:#fff;border:2px solid #4466ff;font-family:inherit;
           font-size:16px;padding:6px 10px;letter-spacing:4px;text-align:center;width:200px;margin:8px;}
#nameInput:focus{outline:none;border-color:#ffff44;}
#shopList::-webkit-scrollbar{width:6px;}
#shopList::-webkit-scrollbar-track{background:#000044;}
#shopList::-webkit-scrollbar-thumb{background:#4466aa;}
#bgmBtn{position:absolute;bottom:6px;right:8px;font-size:10px;padding:3px 7px;
        border:1px solid #4466ff;background:#000044;color:#aaaaff;cursor:pointer;
        font-family:inherit;z-index:30;}
#bgmBtn:hover{border-color:#ffff44;color:#ffff44;}
</style>
</head>
<body>
<div id="gc">
  <div id="mapWrap">
    <canvas id="mapCanvas" width="576" height="384"></canvas>
    <button id="bgmBtn" onclick="toggleBgm()">🎵 BGM</button>

    <!-- TITLE -->
    <div id="titleOv" class="overlay" style="display:flex;">
      <div style="color:#ffaa00;font-size:20px;margin-bottom:8px;">★ ★ ★ ★ ★ ★</div>
      <h1>勇者伝説 III</h1><h2>～ ゾーマの城 ～</h2>
      <div class="sub">©2026 CLAUDE SOFT  ALL RIGHTS RESERVED</div>
      <button class="startBtn" onclick="startNewGame()">は じ め か ら</button>
      <button class="startBtn" onclick="loadGame()" style="animation:none;margin-top:4px;">つ づ き か ら</button>
    </div>

    <!-- STORY -->
    <div id="storyOv" class="overlay">
      <div id="storyTitle"></div>
      <div id="storyBody"></div>
      <button class="btn" onclick="nextStory()">　つぎへ ▶　</button>
    </div>

    <!-- CLASS SELECT -->
    <div id="classOv" class="overlay" style="flex-direction:column;align-items:center;">
      <div class="ovTitle" id="classTitle">なかまをえらべ！</div>
      <div id="classList"></div>
      <div style="font-size:12px;color:#888;margin-top:8px;" id="classHint"></div>
    </div>

    <!-- BATTLE -->
    <div id="battleOv" class="overlay">
      <div id="battleBg">
        <div class="enemyBlock" id="eblk0"></div>
        <div class="enemyBlock" id="eblk1"></div>
        <div class="enemyBlock" id="eblk2"></div>
      </div>
      <div id="battleMsg"></div>
      <div id="battleCmds">
        <button class="btn" onclick="battleCmd('attack')">たたかう</button>
        <button class="btn" onclick="battleCmd('spell')">じゅもん</button>
        <button class="btn" onclick="battleCmd('item')">どうぐ</button>
        <button class="btn" onclick="battleCmd('defend')">ぼうぎょ</button>
        <button class="btn red" onclick="battleCmd('run')">にげる</button>
      </div>
      <div id="spellPanel"></div>
      <div id="targetPanel"></div>
      <div id="battleContBtn"><button class="btn grn" onclick="endBattle()">　続ける ▶　</button></div>
    </div>

    <!-- SHOP -->
    <div id="shopOv" class="overlay" style="flex-direction:column;align-items:center;">
      <div class="ovTitle">🏪 お み せ</div>
      <div id="shopTabs">
        <button class="shopTab active" onclick="shopTab('items')">どうぐ</button>
        <button class="shopTab" onclick="shopTab('weapons')">ぶき</button>
        <button class="shopTab" onclick="shopTab('armors')">ぼうぐ</button>
      </div>
      <div id="shopList"></div>
      <div id="shopGold">所持金: 0 G</div>
      <button class="btn" style="margin-top:4px" onclick="closeShop()">　とじる　</button>
    </div>

    <!-- INN -->
    <div id="innOv" class="overlay" style="flex-direction:column;gap:10px;">
      <div class="ovTitle">🏨 やどや</div>
      <p style="font-size:13px;color:#ccffcc;text-align:center;line-height:1.8">
        一泊 <span id="innCost" style="color:#ffff44">0</span> G でございます。<br>おとまりになりますか？</p>
      <button class="btn" onclick="doInn()">はい</button>
      <button class="btn" onclick="closeInn()">いいえ</button>
    </div>

    <!-- MENU -->
    <div id="menuOv" class="overlay">
      <div class="ovTitle" style="margin-bottom:8px">ステータス</div>
      <div id="menuCharTabs"></div>
      <div id="menuBody"></div>
      <div style="margin-top:8px;display:flex;gap:4px">
        <button class="btn" onclick="openItemMenu()">どうぐ</button>
        <button class="btn" onclick="saveGame()">セーブ</button>
        <button class="btn" onclick="closeMenu()">とじる</button>
      </div>
    </div>

    <!-- GAMEOVER -->
    <div id="gameoverOv" class="overlay" style="flex-direction:column;gap:12px;">
      <div style="font-size:40px;color:#ff4444;text-shadow:0 0 20px #ff0000">GAME OVER</div>
      <p style="color:#cc8888;font-size:13px;text-align:center">勇者たちは倒れてしまった……<br>だが、伝説は終わらない。</p>
      <button class="btn" onclick="reviveParty()">復活して再挑戦</button>
    </div>

    <!-- ENDING -->
    <div id="endingOv" class="overlay" style="flex-direction:column;gap:10px;padding:20px;text-align:center;">
      <div style="font-size:22px;color:#ffff44;">✨ CONGRATULATIONS ✨</div>
      <div id="endingText" style="font-size:13px;color:#ccffcc;line-height:2.2;max-width:400px;"></div>
      <button class="btn" style="margin-top:16px" onclick="location.reload()">タイトルへ</button>
    </div>
  </div>

  <!-- タッチ操作Dパッド -->
  <div id="dpad">
    <div id="dpadGrid">
      <div></div>
      <button class="dpadBtn" ontouchstart="dpadPress(0,-1);event.preventDefault()" ontouchend="dpadRelease()" onmousedown="dpadPress(0,-1)" onmouseup="dpadRelease()">▲</button>
      <div></div>
      <button class="dpadBtn" ontouchstart="dpadPress(-1,0);event.preventDefault()" ontouchend="dpadRelease()" onmousedown="dpadPress(-1,0)" onmouseup="dpadRelease()">◀</button>
      <div class="dpadBtn dpadC"></div>
      <button class="dpadBtn" ontouchstart="dpadPress(1,0);event.preventDefault()" ontouchend="dpadRelease()" onmousedown="dpadPress(1,0)" onmouseup="dpadRelease()">▶</button>
      <div></div>
      <button class="dpadBtn" ontouchstart="dpadPress(0,1);event.preventDefault()" ontouchend="dpadRelease()" onmousedown="dpadPress(0,1)" onmouseup="dpadRelease()">▼</button>
      <div></div>
    </div>
  </div>

  <div id="partyBar"></div>
  <div id="msgBox"><span id="msgText"></span><span class="arr" id="msgArr" style="display:none">▼</span></div>
  <div id="cmdArea">
    <button class="btn" onclick="cmdTalk()">はなす</button>
    <button class="btn" onclick="cmdSearch()">しらべる</button>
    <button class="btn" onclick="openMenu()">メニュー</button>
    <button class="btn" onclick="saveGame()">セーブ</button>
  </div>
</div>

  function _init(){
    if(_ctx) return;
    _ctx=new(window.AudioContext||window.webkitAudioContext)();
    _bgG=_ctx.createGain(); _bgG.gain.value=1.0; _bgG.connect(_ctx.destination);
    _seG=_ctx.createGain(); _seG.gain.value=0.38; _seG.connect(_ctx.destination);
  }
  function _note(freq,t,dur,wave,vol,instG){
    if(!freq||!_ctx) return;
    const o=_ctx.createOscillator(), g=_ctx.createGain();
    o.type=wave||'square'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||.5,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur*.85);
    o.connect(g); g.connect(instG||_seG);
    o.start(t); o.stop(t+dur);
  }
  function _sched(name,t0,instG){
    const trk=TRK[name]; if(!trk) return 0;
    const b=60/trk.bpm; let mx=0;
    trk.v.forEach(v=>{
      let t=t0;
      v.n.forEach(([n,beats])=>{
        const d=beats*b;
        if(NF[n]) _note(NF[n],t,d,v.w,v.vol*0.22,instG);
        t+=d;
      });
      const tb=v.n.reduce((s,[,b2])=>s+b2,0);
      if(tb>mx) mx=tb;
    });
    return mx*b;
  }

  return {
    bgm(name){
      _init(); if(_ctx.state==='suspended') _ctx.resume();
      this.stop(); _cur=name;
      const trk=TRK[name]; if(!trk) return;
      // BGMごとに独立したGainノードを作成（古いBGMとの重複を防ぐ）
      const inst=_ctx.createGain();
      inst.gain.value=_bgMute?0:1.0;
      inst.connect(_ctx.destination);
      _bgInst=inst;
      const loop=()=>{
        if(_cur!==name||_bgInst!==inst) return;
        const d=_sched(name,_ctx.currentTime+.05,inst);
        if(trk.loop!==false) _loopT=setTimeout(loop,(d-.15)*1000);
      };
      loop();
    },
    stop(){
      _cur=null; if(_loopT){clearTimeout(_loopT);_loopT=null;}
      // 古いBGMをフェードアウトして切断
      if(_bgInst){
        const old=_bgInst; _bgInst=null;
        const t=_ctx?.currentTime||0;
        try{
          old.gain.setValueAtTime(old.gain.value,t);
          old.gain.linearRampToValueAtTime(0,t+0.25);
          setTimeout(()=>{try{old.disconnect();}catch(e){}},400);
        }catch(e){}
      }
    },
    toggle(){
      _bgMute=!_bgMute;
      if(_bgInst) _bgInst.gain.setValueAtTime(_bgMute?0:1.0,_ctx?.currentTime||0);
      return !_bgMute;
    },
    se(name){
      _init(); if(_ctx.state==='suspended') _ctx.resume();
      const t=_ctx.currentTime;
      const p=(f,t0,d,w,v)=>_note(f,t0,d,w||'square',v||.5,null);
      switch(name){
        case 'step': {
          const now=Date.now(); if(now-_lastStep<90) break; _lastStep=now;
          p(330,t,.03,'square',.08); break;

function mkChar(classKey,name){
  const cl=CLASSES[classKey];
  const spells=cl.learn.filter(l=>l.lv<=1).map(l=>l.s);
  return{classKey,name:name||cl.name,emoji:cl.emoji,lv:1,exp:0,
         hp:cl.hp,maxHp:cl.hp,mp:cl.mp,maxMp:cl.mp,
         atk:cl.atk,def:cl.def,spd:cl.spd,int:cl.int,spells,
         weapon:null,armor:null,shield:null,status:'ok',cl};
}
function lvupChar(ch){
  const cl=ch.cl; ch.lv++;
  ch.maxHp+=cl.hg+rnd(0,4); ch.maxMp+=cl.mg+rnd(0,2);
  ch.hp=ch.maxHp; ch.mp=ch.maxMp;
  ch.atk+=cl.ag+rnd(0,2); ch.def+=cl.dg+rnd(0,1);
  ch.spd+=cl.sg; ch.int+=cl.ig+rnd(0,1);
  let ns=[];
  (cl.learn||[]).forEach(l=>{if(l.lv===ch.lv&&!ch.spells.includes(l.s)){ch.spells.push(l.s);ns.push(SPELLS[l.s].name);}});
  return ns;
}
function charTotalAtk(ch){return ch.atk+(ch.weapon?ch.weapon.atk:0);}
function charTotalDef(ch){return ch.def+(ch.armor?ch.armor.def:0)+(ch.shield?ch.shield.def:0);}

function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

const canvas=document.getElementById('mapCanvas');
canvas.width=VC*TS;
canvas.height=VR*TS;
const ctx=canvas.getContext('2d');

function drawMap(){
  const cx=G.camX,cy=G.camY;
  for(let r=0;r<VR;r++){for(let c=0;c<VC;c++){
    const mx=cx+c,my=cy+r;
    if(mx<0||mx>=MC||my<0||my>=MR){ctx.fillStyle='#000';ctx.fillRect(c*TS,r*TS,TS,TS);continue;}
    const td=TDATA[WMAP[my][mx]]||TDATA[0];
    ctx.fillStyle=td.c; ctx.fillRect(c*TS,r*TS,TS,TS);
    ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.strokeRect(c*TS,r*TS,TS,TS);
  }}
  const half=TS/2;
  ctx.font=Math.round(TS*.56)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let r=0;r<VR;r++){for(let c=0;c<VC;c++){
    const mx=cx+c,my=cy+r;
    if(mx<0||mx>=MC||my<0||my>=MR) continue;
    const icon=TICON[WMAP[my][mx]];
    if(icon) ctx.fillText(icon,c*TS+half,r*TS+half);
  }}
  const px=G.px-cx,py=G.py-cy;
  if(px>=0&&px<VC&&py>=0&&py<VR){
    ctx.font=Math.round(TS*.69)+'px serif'; ctx.fillText(G.party[0]?.emoji||'🧙',px*TS+half,py*TS+Math.round(TS*.44));
  }
}
function updateCamera(){
  G.camX=clamp(G.px-Math.floor(VC/2),0,MC-VC);
  G.camY=clamp(G.py-Math.floor(VR/2),0,MR-VR);
}

  if(!G.party.length){bar.innerHTML='';return;}
  bar.innerHTML=G.party.map(ch=>{
    const pct=clamp(ch.hp/ch.maxHp*100,0,100);
    const dead=ch.status==='dead';
    const hpCl=pct<25?'crit':pct<50?'low':'';
    return`<div class="charCard">
      <div class="cname">${ch.emoji}${ch.name}${ch.status==='poison'?' 🟣':ch.status==='sleep'?' 💤':dead?' ☠️':''}</div>
      <div class="hpbar"><div style="width:${pct}%" class="${hpCl}"></div></div>
      <div class="${dead?'cdead':'chp'}">HP ${ch.hp}/${ch.maxHp}</div>
      <div class="cmp">MP ${ch.mp}/${ch.maxMp}</div>
    </div>`;
  }).join('');
}

// ============================================================
let moveBlocked=false;

// ---- タッチDパッド ----
let _dpadTimer=null;
function dpadPress(dx,dy){
  if(G.state!=='map'||moveBlocked) return;
  movePlayer(dx,dy);
  _dpadTimer=setInterval(()=>{if(G.state==='map'&&!moveBlocked)movePlayer(dx,dy);},180);
}
function dpadRelease(){clearInterval(_dpadTimer);_dpadTimer=null;}
document.getElementById('dpad').addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
document.getElementById('dpad').addEventListener('touchend',  e=>e.preventDefault(),{passive:false});
// ---- ここまで ----

document.addEventListener('keydown',e=>{
  if(G.state!=='map'||moveBlocked) return;
  let dx=0,dy=0;
  if(e.key==='ArrowLeft'||e.key==='a') dx=-1;
  else if(e.key==='ArrowRight'||e.key==='d') dx=1;
  else if(e.key==='ArrowUp'||e.key==='w') dy=-1;
  else if(e.key==='ArrowDown'||e.key==='s') dy=1;
  if(dx||dy){e.preventDefault();movePlayer(dx,dy);}
});
function movePlayer(dx,dy){
  const nx=G.px+dx,ny=G.py+dy;
  if(nx<0||nx>=MC||ny<0||ny>=MR) return;
  const t=WMAP[ny][nx], td=TDATA[t]||{pass:false};
  if(!td.pass){AUDIO.se('error');setMsg('そこには行けない。');return;}
  G.px=nx; G.py=ny;
  AUDIO.se('step');
  updateCamera(); drawMap();
  checkLoc();
  if(td.enc&&Math.random()<(td.rate||.15)) setTimeout(()=>startRandBattle(),200);
}
function checkLoc(){
  for(const[k,loc]of Object.entries(LOCS)){
    if(loc.x===G.px&&loc.y===G.py){handleLoc(k,loc);return;}
  }
}
function handleLoc(k,loc){
  moveBlocked=true; AUDIO.se('door');
  if(loc.type==='castle') handleCastle(k,loc);
  else if(loc.type==='village'||loc.type==='town') handleTown(k,loc);
  else if(loc.type==='tower') handleTower(k,loc);
  else if(loc.type==='cave') handleCave(k,loc);
  else if(loc.type==='dungeon') handleDungeon(k,loc);
  else if(loc.type==='port') handlePort(k,loc);
}

    if(ch){const slot=it.type==='shield'?'shield':it.type; ch[slot]={...it}; setMsg(`${ch.name}は ${it.name} を装備した！`);}
  }

// BATTLE SYSTEM
// ============================================================
let battleEnemies=[], pendingSpell=null, pendingActorIdx=null;

function startRandBattle(){
  const pool=MONS.filter(m=>!m.boss&&m.zone<=G.zone+1&&m.zone>=G.zone-1);
  if(!pool.length) return;
  const base=pool[rnd(0,pool.length-1)];
  const count=rnd(1,Math.min(3,base.sz||1));
  startBattleWith(Array.from({length:count},()=>mkEnemy(base)));
}
function mkEnemy(tmpl){
  const hp=tmpl.hp+rnd(-Math.floor(tmpl.hp*.1),Math.floor(tmpl.hp*.1));
  return{...tmpl,hp,maxHp:hp,alive:true};
}
function startBattleWith(enemies){
  AUDIO.se('encounter');
  battleEnemies=enemies.map(e=>({...e,alive:true,maxHp:e.hp}));
  G.state='battle'; moveBlocked=true;
  const isBoss=G.flags.inBoss;
  AUDIO.bgm(isBoss?'boss':'battle');
  renderBattleEnemies();
  document.getElementById('battleOv').style.display='flex';
  document.getElementById('battleContBtn').style.display='none';
  bMsg(battleEnemies.length===1?`${battleEnemies[0].name}が現れた！`:`${battleEnemies[0].name}たちが現れた！`);
  setTimeout(()=>nextBattleTurn(),600);
}
function renderBattleEnemies(){
  for(let i=0;i<3;i++){
    const blk=document.getElementById(`eblk${i}`),e=battleEnemies[i];
    if(!e){blk.innerHTML='';continue;}
    const pct=clamp(e.hp/e.maxHp*100,0,100);
    blk.innerHTML=`<div class="enemyEmoji${e.alive?'':' dead'}" id="eemoji${i}">${e.emoji}</div>
      <div class="enemyName">${e.name}</div>
      <div class="enemyHpW"><div class="enemyHpI" id="ehpb${i}" style="width:${pct}%"></div></div>
      <div style="font-size:9px;color:#ffaaaa">${e.hp}/${e.maxHp}</div>`;
  }
}
function bMsg(txt){document.getElementById('battleMsg').innerHTML=txt;}
function showBCmds(show){document.getElementById('battleCmds').style.display=show?'flex':'none';}
function hideSP(){document.getElementById('spellPanel').style.display='none';}
function hideTP(){document.getElementById('targetPanel').style.display='none';}
function nextBattleTurn(){
  if(battleEnemies.every(e=>!e.alive)){battleWin();return;}
  if(G.party.every(ch=>ch.status==='dead')){battleLose();return;}
  showBCmds(true); hideSP(); hideTP();
  showBattlePlayerMenu(0);
}
function showBattlePlayerMenu(charIdx){
  while(charIdx<G.party.length&&G.party[charIdx].status==='dead') charIdx++;
  if(charIdx>=G.party.length){enemyTurns();return;}
  pendingActorIdx=charIdx;
  const ch=G.party[charIdx];
  bMsg(`${ch.emoji}${ch.name}のターン (HP:${ch.hp} MP:${ch.mp})`);
  showBCmds(true); hideSP(); hideTP();
}
function showSpellPanel(ch){
  const panel=document.getElementById('spellPanel');
  panel.innerHTML=ch.spells.map(s=>{
    const sp=SPELLS[s];
    return`<button class="btn" onclick="castSpell('${s}')" ${ch.mp<sp.mp?'disabled':''}>${sp.name}(${sp.mp}MP)</button>`;
  }).join('');
  const b=document.createElement('button');
  b.className='btn'; b.textContent='もどる'; b.onclick=()=>{hideSP();showBCmds(true);};
  panel.appendChild(b); panel.style.display='flex';
}
function showTargetPanel(enemies,cb){
  const panel=document.getElementById('targetPanel');
  panel.innerHTML=enemies.map((e)=>`<button class="btn" onclick="doTargetSelect(${battleEnemies.indexOf(e)})">${e.emoji}${e.name}</button>`).join('');
  window._tgtCb=cb; panel.style.display='flex';
}
function doTargetSelect(eIdx){
  hideTP(); const e=battleEnemies[eIdx];
  if(window._tgtCb){window._tgtCb(e);window._tgtCb=null;}
}
function battleCmd(cmd){
  const ch=G.party[pendingActorIdx]; if(!ch) return;
  showBCmds(false);
  if(cmd==='attack'){
    const alive=battleEnemies.filter(e=>e.alive);
    if(!alive.length) return;
    if(alive.length===1){doPhysAtk(ch,alive[0]);setTimeout(()=>afterPlayerAction(),900);}
    else{bMsg('どの敵を攻撃する？');showTargetPanel(alive,e=>{doPhysAtk(ch,e);setTimeout(()=>afterPlayerAction(),900);});}
  } else if(cmd==='spell'){
    if(!ch.spells.length){bMsg('呪文を知らない！');setTimeout(()=>showBCmds(true),500);return;}
    showSpellPanel(ch);
  } else if(cmd==='item'){
    if(!G.items.length){bMsg('どうぐがない！');setTimeout(()=>showBCmds(true),500);return;}
    showItemPanel(ch);
  } else if(cmd==='defend'){
    ch._defending=true;
    bMsg(`${ch.name}はぼうぎょした！`);
    setTimeout(()=>showBattlePlayerMenu(pendingActorIdx+1),700);
  } else if(cmd==='run'){
    const avg=battleEnemies.reduce((s,e)=>s+e.spd,0)/battleEnemies.length;
    if(Math.random()<Math.min(.9,Math.max(.2,ch.spd/(ch.spd+avg)))){
      bMsg('うまく逃げ切った！'); setTimeout(()=>endBattle(),900);
    } else {
      bMsg('逃げられなかった！'); setTimeout(()=>showBattlePlayerMenu(pendingActorIdx+1),900);
    }
  }
}
function showItemPanel(ch){
  const panel=document.getElementById('targetPanel');
  panel.innerHTML=G.items.map((it,i)=>`<button class="btn" onclick="useItemBattle(${i})" style="font-size:11px">${it.name}×${it.count||1}</button>`).join('');
  const b=document.createElement('button');
  b.className='btn'; b.textContent='もどる'; b.onclick=()=>{hideTP();showBCmds(true);};
  panel.appendChild(b); panel.style.display='flex';
}
function useItemBattle(idx){
  hideTP();
  const it=G.items[idx]; if(!it){showBCmds(true);return;}
  const ch=G.party[pendingActorIdx];
  AUDIO.se('item');
  const prevHp=ch.hp; applyItem(it,ch);
  const healed=ch.hp-prevHp;
  it.count=(it.count||1)-1; if(it.count<=0) G.items.splice(idx,1);
  bMsg(`${ch.name}は ${it.name} を使った！<br>HPが <span style="color:#44ff44">${healed}</span> 回復！`);
  renderPartyBar();
  setTimeout(()=>showBattlePlayerMenu(pendingActorIdx+1),900);
}
function afterPlayerAction(){
  if(battleEnemies.every(e=>!e.alive)) battleWin();
  else showBattlePlayerMenu(pendingActorIdx+1);
}
function castSpell(key){
  hideSP();
  const ch=G.party[pendingActorIdx],sp=SPELLS[key];
  if(!sp||ch.mp<sp.mp){bMsg('MPが足りない！');setTimeout(()=>showBCmds(true),500);return;}
  ch.mp-=sp.mp; renderPartyBar();
  AUDIO.se(sp.type==='heal'||sp.type==='healall'||sp.type==='revive'?'heal':'spell');

  if(sp.type==='heal'||sp.type==='healall'){
    if(sp.tgt==='all'){
      G.party.filter(c=>c.status!=='dead').forEach(t=>{t.hp=Math.min(t.maxHp,t.hp+(sp.pow>=9999?t.maxHp:sp.pow));});
      bMsg(`${ch.name}は ${sp.name}！<br>全員のHPが回復した！`);
    } else {
      const alive=G.party.filter(c=>c.status!=='dead');
      if(alive.length===1){
        const t=alive[0]; const h=Math.min(t.maxHp-t.hp,sp.pow>=9999?t.maxHp:sp.pow);
        t.hp+=h; bMsg(`${ch.name}は ${sp.name}！　${t.name}のHP +${h} 回復！`);
      } else {
        bMsg(`${sp.name}：誰に使う？`);
        const panel=document.getElementById('targetPanel');
        panel.innerHTML=alive.map((t,i)=>`<button class="btn" onclick="healTargetBattle(${G.party.indexOf(t)},'${key}')">${t.emoji}${t.name}(${t.hp}/${t.maxHp})</button>`).join('');
        panel.style.display='flex'; return;
      }
    }
    renderPartyBar(); setTimeout(()=>showBattlePlayerMenu(pendingActorIdx+1),900);
  } else if(sp.type==='revive'){
    const dead=G.party.find(c=>c.status==='dead');
    if(!dead){bMsg('戦闘不能の仲間がいない！');setTimeout(()=>showBCmds(true),500);return;}
    dead.status='ok'; dead.hp=Math.ceil(dead.maxHp*.5);
    bMsg(`${ch.name}は ${sp.name}！　${dead.name}が生き返った！`);
    renderPartyBar(); setTimeout(()=>showBattlePlayerMenu(pendingActorIdx+1),900);
  } else if(sp.type==='cure'){
    const t=G.party.find(c=>c.status==='poison'||c.status==='sleep');
    if(!t){bMsg('回復が必要な仲間がいない。');setTimeout(()=>showBCmds(true),500);return;}
    t.status='ok'; bMsg(`${ch.name}は ${sp.name}！　${t.name}の異常が治った！`);
    renderPartyBar(); setTimeout(()=>showBattlePlayerMenu(pendingActorIdx+1),900);
  } else if(sp.type==='attack'){
    const alive=battleEnemies.filter(e=>e.alive);
    if(!alive.length){endBattle();return;}
    animSpell();
    if(sp.tgt==='all_e'||sp.tgt==='all'){
      let msg=`${ch.name}は <span style="color:#44ffff">${sp.name}</span>！`;
      alive.forEach(e=>{
        const mag=Math.floor(sp.pow*(ch.int/15)*(.9+Math.random()*.2));
        const dmg=Math.max(1,mag-Math.floor(e.def*.3));
        e.hp=Math.max(0,e.hp-dmg); if(e.hp<=0){e.alive=false;}
        msg+=`<br>${e.name}に <span style="color:#ffff44">${dmg}</span> ダメージ！`;
      });
      bMsg(msg); renderBattleEnemies();
      setTimeout(()=>{if(battleEnemies.every(e=>!e.alive))battleWin();else showBattlePlayerMenu(pendingActorIdx+1);},1000);
    } else {
      if(alive.length===1){doSpellAtk(ch,alive[0],sp);setTimeout(()=>afterPlayerAction(),900);}
      else{
        bMsg(`${sp.name}：どの敵に？`); pendingSpell=sp;
        showTargetPanel(alive,e=>{doSpellAtk(ch,e,pendingSpell);setTimeout(()=>afterPlayerAction(),900);});
      }
    }
  } else if(sp.type==='escape'){
    bMsg(`${ch.name}は ${sp.name} を唱えた！`);
    setTimeout(()=>{endBattle();G.px=4;G.py=3;updateCamera();drawMap();},800);
  }
}
function healTargetBattle(charIdx,key){
  hideTP();
  const ch=G.party[pendingActorIdx],t=G.party[charIdx],sp=SPELLS[key];
  const h=Math.min(t.maxHp-t.hp,sp.pow>=9999?t.maxHp:sp.pow);
  t.hp=Math.min(t.maxHp,t.hp+sp.pow);
  bMsg(`${ch.name}は ${sp.name}！　${t.name}のHP +${h} 回復！`);
  renderPartyBar(); setTimeout(()=>showBattlePlayerMenu(pendingActorIdx+1),900);
}
function doPhysAtk(ch,e){
  AUDIO.se('attack');
  const dmg=Math.max(1,Math.floor(charTotalAtk(ch)*(.85+Math.random()*.3))-Math.floor(e.def*.5));
  e.hp=Math.max(0,e.hp-dmg); if(e.hp<=0) e.alive=false;
  animHit(battleEnemies.indexOf(e)); renderBattleEnemies();
  bMsg(`${ch.emoji}${ch.name}の攻撃！<br>${e.name}に <span style="color:#ffff44">${dmg}</span> のダメージ！${e.alive?'':'<br><span style="color:#ff4444">'+e.name+'を倒した！</span>'}`);
}
function doSpellAtk(ch,e,sp){
  AUDIO.se('spell');
  const mag=Math.floor(sp.pow*(ch.int/15)*(.9+Math.random()*.2));
  const dmg=Math.max(1,mag-Math.floor(e.def*.3));
  e.hp=Math.max(0,e.hp-dmg); if(e.hp<=0) e.alive=false;
  animSpell(); renderBattleEnemies();
  bMsg(`${ch.name}は <span style="color:#44ffff">${sp.name}</span>！<br>${e.name}に <span style="color:#ffff44">${dmg}</span> のダメージ！${e.alive?'':'<br><span style="color:#ff4444">'+e.name+'を倒した！</span>'}`);
}
function animHit(idx){
  const el=document.getElementById(`eemoji${idx}`); if(!el) return;
  el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),200);
}
function animSpell(){
  const bg=document.getElementById('battleBg');
  bg.style.background='linear-gradient(180deg,#002244,#440088)';
  setTimeout(()=>bg.style.background='linear-gradient(180deg,#001133,#002255 60%,#221100)',300);
}
function enemyTurns(){
  const alive=battleEnemies.filter(e=>e.alive);
  if(!alive.length){battleWin();return;}
  const aliveP=G.party.filter(ch=>ch.status!=='dead');
  if(!aliveP.length){battleLose();return;}
  let msg='';
  let idx=0;
  function next(){
    if(idx>=alive.length){
      G.party.forEach(ch=>ch._defending=false);
      renderPartyBar();
      if(G.party.every(ch=>ch.status==='dead')){battleLose();return;}
      bMsg(msg||'敵の攻撃！');
      setTimeout(()=>nextBattleTurn(),1000);
      return;
    }
    const e=alive[idx++];
    const alP=G.party.filter(ch=>ch.status!=='dead');
    if(!alP.length){battleLose();return;}
    const t=alP[rnd(0,alP.length-1)];
    AUDIO.se('damage');
    if(e.sp&&Math.random()<.25&&e.mp>0){
      const sp=SPELLS[e.sp];
      if(sp&&sp.type==='attack'){
        const mag=Math.floor(sp.pow*(.8+Math.random()*.4));
        const def=charTotalDef(t)*(t._defending?.5:1);
        const dmg=Math.max(1,mag-Math.floor(def*.4));
        t.hp=Math.max(0,t.hp-dmg); if(t.hp<=0){t.hp=0;t.status='dead';}
        msg+=`${e.name}は <span style="color:#ff8844">${sp.name}</span>！　${t.emoji}${t.name}に <span style="color:#ff8844">${dmg}</span> ダメージ！<br>`;
      }
    } else {
      const def=charTotalDef(t)*(t._defending?.5:1);
      const dmg=Math.max(1,Math.floor(e.atk*(.85+Math.random()*.3))-Math.floor(def*.5));
      t.hp=Math.max(0,t.hp-dmg); if(t.hp<=0){t.hp=0;t.status='dead';}
      msg+=`${e.name}の攻撃！　${t.emoji}${t.name}に <span style="color:#ff8844">${dmg}</span> ダメージ！<br>`;
    }
    if(t.status==='dead') msg+=`<span style="color:#ff4444">${t.name}は倒れた！</span><br>`;
    next();
  }
  next();
}

function battleWin(){
  showBCmds(false); hideSP(); hideTP();
  let totalExp=0,totalGold=0;
  battleEnemies.forEach(e=>{totalExp+=e.exp;totalGold+=e.gold;});
  G.gold+=totalGold;
  AUDIO.se('victory');

  let msg=`<span style="color:#ffff44">勝利！</span><br>EXP +${totalExp}　GOLD +${totalGold}`;
  let lvMsg='';
  G.party.forEach(ch=>{
    if(ch.status==='dead') return;
    ch.exp+=totalExp;
    while(ch.lv<20&&EXP_TBL[ch.lv+1]&&ch.exp>=EXP_TBL[ch.lv+1]){
      const ns=lvupChar(ch);
      lvMsg+=`<br>🌟 ${ch.name}はLv${ch.lv}に上がった！`;
      if(ns.length) lvMsg+=`　✨${ns.join('・')}を覚えた！`;
      setTimeout(()=>AUDIO.se('levelup'),500);
    }
  });
  bMsg(msg+lvMsg); renderPartyBar();

  if(G.flags.inBoss){
    const bossId=G.flags.currentBoss; G.flags.inBoss=false;
    setTimeout(()=>{
      endBattle();
      if(bossId==='baramos'){
        G.flags.clearedTower=true; G.flags.clearedNecro=true;
        G.hasShip=true;
        AUDIO.bgm('field');
        showStory([
          {t:'バラモス撃破！',b:'強大な敵を倒した！\n\n「ガァァ……まだ……ゾーマが……いる……」\n\nバラモスの声が消えていった……'},
          {t:'船を手に入れた！',b:'バラモスが封印していた船が解放された！\n\n⚓ 各地の港から世界中の島へ航海できる！\n\n地図の ⚓マーク に近づくと出港メニューが開く。\n暗黒大陸（南の島）でゾーマの城へ向かえ！'},
        ],()=>{setMsg('🚢 船を手に入れた！<br>各地の ⚓港 から島間を移動できる。');drawMap();});
      } else if(bossId==='zoma'){
        G.flags.defeatedZoma=true;
        showEnding();
      }
    },2000);
    return;
  }

  // 通常戦闘：続けるボタンを表示してから戻る
  setTimeout(()=>{
    document.getElementById('battleContBtn').style.display='block';
  },800);
}

function battleLose(){
  showBCmds(false); hideSP(); hideTP();
  AUDIO.se('dead');
  bMsg(`<span style="color:#ff4444">全員が倒れてしまった……</span>`);
  setTimeout(()=>{
    AUDIO.bgm('gameover');
    document.getElementById('battleOv').style.display='none';
    document.getElementById('gameoverOv').style.display='flex';
    G.state='gameover';
  },2000);
}

function endBattle(){
  document.getElementById('battleOv').style.display='none';
  document.getElementById('battleContBtn').style.display='none';
  showBCmds(true); hideSP(); hideTP();
  G.state='map'; moveBlocked=false;
  renderPartyBar(); resetCmds(); drawMap();
  AUDIO.bgm(G.mapBgm||'field');
  setMsg('戦闘が終わった。旅を続けよう。');
}

function reviveParty(){
  AUDIO.bgm('field'); G.mapBgm='field';
  document.getElementById('gameoverOv').style.display='none';
  G.party.forEach(ch=>{
    ch.hp=Math.max(1,Math.ceil(ch.maxHp*.5));
    ch.mp=Math.max(0,Math.ceil(ch.maxMp*.5));
    if(ch.status==='dead') ch.status='ok';
  });
  G.px=4; G.py=3; updateCamera(); drawMap();
  G.state='map'; moveBlocked=false;
  renderPartyBar(); resetCmds();
  setMsg('アリアハン城で目を覚ました……<br>HP・MPが半分の状態で復活した。<br>宿屋で回復してから出発しよう。');
}

// ============================================================
// ENDING
// ============================================================

  AUDIO.bgm('ending');
  document.getElementById('battleOv').style.display='none';
  document.getElementById('endingOv').style.display='flex';
  document.getElementById('endingText').innerHTML=`
    大魔王ゾーマは倒れた。<br><br>
    闇の力が消え去り、世界に光が戻った。<br><br>
    ${G.party[0]?.name||'勇者'}たち勇者一行の名は、<br>
    伝説として永遠に語り継がれるだろう……<br><br>
    <span style="color:#ffff44">─ STAFF ROLL ─</span><br>
    <span style="font-size:11px">
    ${G.party.map(ch=>`${ch.emoji} ${ch.name}（${ch.cl.name}） Lv${ch.lv}`).join('<br>')}<br><br>
    クリアレベル: ${G.party[0]?.lv||1} / 所持金: ${G.gold} G<br><br>
    </span>
    <span style="color:#aaaaff">ありがとうございました</span><br>
    <span style="color:#888">©2026 CLAUDE SOFT</span>`;
}

// ============================================================
// SAVE / LOAD
// ============================================================
function saveGame(){
  const save={px:G.px,py:G.py,gold:G.gold,items:G.items,flags:G.flags,zone:G.zone,hasShip:G.hasShip,
    party:G.party.map(ch=>({classKey:ch.classKey,name:ch.name,lv:ch.lv,exp:ch.exp,
      hp:ch.hp,maxHp:ch.maxHp,mp:ch.mp,maxMp:ch.maxMp,atk:ch.atk,def:ch.def,
      spd:ch.spd,int:ch.int,spells:ch.spells,status:ch.status,
      weapon:ch.weapon,armor:ch.armor,shield:ch.shield}))};
  localStorage.setItem('dq3save',JSON.stringify(save));
  AUDIO.se('save'); setMsg('ゲームをセーブした！');
}
function loadGame(){
  const raw=localStorage.getItem('dq3save');
  if(!raw){setMsg('セーブデータがない。');return;}
  try{
    const s=JSON.parse(raw);
    G.px=s.px||4;G.py=s.py||3;G.gold=s.gold||200;G.items=s.items||[];
    G.flags=s.flags||{};G.zone=s.zone||1;G.hasShip=s.hasShip||false;
    G.party=(s.party||[]).map(p=>{const ch=mkChar(p.classKey,p.name);Object.assign(ch,p);ch.cl=CLASSES[p.classKey];return ch;});
    document.getElementById('titleOv').style.display='none';
    G.state='map'; G.mapBgm='field'; AUDIO.bgm('field');
    updateCamera();drawMap();renderPartyBar();resetCmds();
    setMsg('冒険を再開した！');
  } catch(e){setMsg('セーブデータの読み込みに失敗した。');}
}

// ============================================================
// GAME START / CLASS SELECT
// ============================================================
function startNewGame(){
  AUDIO.bgm('title');
  document.getElementById('titleOv').style.display='none';
  showStory([
    {t:'〜 プロローグ 〜',b:'時は遠い昔……\n\n大魔王ゾーマが世界に闇をもたらし、\n人々は恐怖と絶望に打ちひしがれていた。'},
    {t:'〜 星の予言 〜',b:'しかし、古文書にはこう記されていた。\n\n「アリアハンの勇者が現れし時、\n仲間とともに闇を討ち、\n光を世界に取り戻すであろう」'},
    {t:'〜 パーティ編成 〜',b:'さあ、勇者よ。\n旅に出る前になかまを選ぶがよい。\n\n勇者のほかに２名のなかまを\nえらぶことができる。'},
  ],()=>{openClassSelect();});
}
function openClassSelect(){
  G.party=[mkChar('hero','勇者')];G.classSelection=[];G.classStep=0;
  renderClassSelect(); document.getElementById('classOv').style.display='flex';
}
function renderClassSelect(){
  const step=G.classStep;
  document.getElementById('classTitle').textContent=['1人目のなかまを選べ','2人目のなかまを選べ'][step]||'えらべ';
  const avail=Object.entries(CLASSES).filter(([k])=>k!=='hero');
  document.getElementById('classList').innerHTML=avail.map(([k,cl])=>`
    <button class="classCard${G.classSelection.includes(k)?' chosen':''}" onclick="selectClass('${k}')">
      <span class="ce">${cl.emoji}</span>
      <span class="ci"><div class="cn">${cl.name}</div><div class="cd">${cl.desc}</div>
      <div class="cd" style="margin-top:2px;color:#666">HP:${cl.hp} ATK:${cl.atk} SPD:${cl.spd}</div></span>
    </button>`).join('');
}
function selectClass(k){
  if(G.classSelection.includes(k)){G.classSelection=G.classSelection.filter(c=>c!==k);G.classStep=Math.max(0,G.classStep-1);renderClassSelect();return;}
  const names=['アンナ','ベルク','シア','ロン','カイ'];
  G.classSelection.push(k);
  G.party.push(mkChar(k,names[G.party.length-1]||CLASSES[k].name));
  G.classStep++;
  if(G.classStep>=2){document.getElementById('classOv').style.display='none';finishSetup();}
  else renderClassSelect();
}
function finishSetup(){
  G.state='map'; G.px=4;G.py=3; G.zone=1;
  G.mapBgm='field'; AUDIO.bgm('field');
  updateCamera();drawMap();renderPartyBar();resetCmds();
  showStory([
    {t:'旅立ち',b:`${G.party[0].name}は${G.party.slice(1).map(c=>`${c.name}（${c.cl.name}）`).join('と')}とともに\nアリアハン城を出発した！\n\nWASD または 矢印キーで移動。\nまず城の中心（🏰）で王様に話しかけよう！`},
  ],()=>{setMsg('アリアハン城に到着！<br>★ WASD / 矢印キー で移動　★ 城の中心で王様に会おう');});
}

function setMsg(txt){
  document.getElementById('msgText').innerHTML=txt;
  document.getElementById('msgArr').style.display='none';
}

// INIT
drawMap();
setMsg('勇者伝説III へようこそ！<br>「はじめから」または「つづきから」を選んでください。');
</script>
